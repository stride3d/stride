name: Set up Lavapipe on a Linux runner
description: >-
  Start a virtual display, and register Lavapipe (the software driver of Stride.Dependencies.Lavapipe) as the Vulkan
  ICD through VK_DRIVER_FILES. Lavapipe's x11 WSI needs a display server to expose VK_KHR_swapchain, which Stride's
  GraphicsDevice requires even for offscreen rendering. The Ubuntu image already has the Vulkan loader and Xvfb. The
  user NuGet config must list nuget.org: the package is restored from outside the workspace.

runs:
  using: composite
  steps:
    - name: Start virtual display
      shell: bash
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - name: Install Lavapipe and register its Vulkan ICD
      shell: bash
      run: |
        # A throwaway project restore puts the package in the NuGet cache, at the version the commit pins
        VERSION=$(pwsh -NoProfile -Command "(([xml](Get-Content -Raw sources/Directory.Packages.props)).GetElementsByTagName('PackageVersion') | Where-Object Include -eq 'Stride.Dependencies.Lavapipe').Version")
        if [ -z "$VERSION" ]; then
          echo "::error::sources/Directory.Packages.props pins no Stride.Dependencies.Lavapipe"
          exit 1
        fi
        tmpDir="${{ runner.temp }}/lavapipe-fetch"
        mkdir -p "$tmpDir"
        cat > "$tmpDir/LavapipeFetch.csproj" <<'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
        </Project>
        EOF
        dotnet add "$tmpDir/LavapipeFetch.csproj" package Stride.Dependencies.Lavapipe --version "$VERSION"
        LIB=$(find "${NUGET_PACKAGES:-$HOME/.nuget/packages}/stride.dependencies.lavapipe/$VERSION" -path "*/runtimes/linux-x64/native/libvulkan_lvp.so" | head -1)
        if [ -z "$LIB" ]; then
          echo "::error::Lavapipe libvulkan_lvp.so not found in NuGet cache"
          exit 1
        fi
        LIB_ABS=$(readlink -f "$LIB")
        ICD_JSON="${{ runner.temp }}/lvp_icd.json"
        echo "{\"file_format_version\":\"1.0.0\",\"ICD\":{\"library_path\":\"$LIB_ABS\",\"api_version\":\"1.3.0\"}}" > "$ICD_JSON"
        echo "VK_DRIVER_FILES=$ICD_JSON" >> $GITHUB_ENV
        echo "Registered Lavapipe ICD: $ICD_JSON -> $LIB_ABS"
