name: Effect cache
description: >-
  Keeps the effect caches of the game tests (the cache folder next to each test assembly; the Android and
  iOS drivers copy the app's cache there and back) between runs, so that the tests load their effects
  instead of compiling them. Cache entries are keyed on the shader sources
  and ShaderCompilerVersion, not on the compiler code: the key of this cache holds a hash of the compiler and
  of the versions of its packages (and of the FXC of the runner when the lane uses it), so a compiler change starts from
  an empty cache. A run restores the newest cache of the same compiler; the effects of changed shaders miss
  and compile. Use `restore` after the checkout and `save` after the tests. Only runs outside pull requests
  save, and only when their tests compiled something new. A shader corpus capture (STRIDE_SHADER_CORPUS_CAPTURE
  set on the job) starts from an empty cache and saves nothing: the capture records an effect when it
  compiles, not when it loads from the cache.

inputs:
  mode:
    description: '`restore` or `save`'
    required: true
  lane:
    description: The graphics API and configuration of the lane, which decide what the tests compile
    required: true
  fxc:
    description: Whether the lane compiles with FXC (Direct3D 11), whose d3dcompiler_47.dll comes from the Windows SDK of the runner
    default: 'false'

runs:
  using: composite
  steps:
    - name: Effect cache key packages
      if: inputs.mode == 'restore' && env.STRIDE_SHADER_CORPUS_CAPTURE == ''
      shell: pwsh
      run: |
        # The versions of the packages the compiler's projects reference, not the whole of Directory.Packages.props.
        # What this can't read for sure hashes the whole file instead: a colder cache, never a stale one.
        $props = 'sources/Directory.Packages.props'
        $packages = try {
          $central = [xml](Get-Content -Raw $props)
          if ($central.SelectNodes('//*[@Condition] | //Import').Count) { throw 'it has a Condition or an Import' }
          $properties = @{}
          foreach ($p in $central.SelectNodes('/Project/PropertyGroup/*')) { $properties[$p.LocalName] = $p.InnerText }
          $versions = @{}
          foreach ($v in $central.SelectNodes('/Project/ItemGroup/PackageVersion')) { $versions[$v.Include] = $v.Version }
          $projects = git ls-files -- 'sources/shaders/*.csproj' ':!sources/shaders/Stride.Shaders.Tests'
          $names = foreach ($path in $projects) {
            $project = [xml](Get-Content -Raw $path)
            if ($project.SelectNodes('//PackageReference[@Version or @VersionOverride]').Count) { throw "$path sets a version" }
            $project.SelectNodes('//PackageReference') | ForEach-Object { $_.Include }
          }
          if (-not $names) { throw 'no package found' }
          $lines = foreach ($name in $names | Sort-Object -Unique) {
            $version = $versions[$name]
            if ($version -match '^\$\((\w+)\)$') { $version = $properties[$Matches[1]] }
            if ($version -notmatch '^\d[\w.+-]*$') { throw "no version for $name" }
            "$name=$version"
          }
          $lines
        } catch {
          "::warning::Effect cache key: $props can't be read ($_), so the key hashes all of it" | Out-Host
          git ls-files -s -- $props
        }
        if (-not $packages) { throw "Effect cache key: nothing to hash for $props" }
        $packages | Out-Host
        $packages | Set-Content -Encoding ascii "$env:RUNNER_TEMP/effect-cache-packages.txt"
    - name: Effect cache key
      if: inputs.mode == 'restore' && env.STRIDE_SHADER_CORPUS_CAPTURE == ''
      shell: bash
      run: |
        # Every tracked file of the compiler (git's blob hashes: no build outputs, no ignored files), not its
        # tests, the test shaders of assets/, or docs. Its native tools come in packages, with their versions.
        # Each exclusion starts with sources/shaders/: git 2.53 drops `:!*.md` here, or then lists nothing at all
        files=$(git ls-files -s -- sources/shaders/ ':!sources/shaders/Stride.Shaders.Tests' ':!sources/shaders/assets' ':!sources/shaders/*.md')
        [ -n "$files" ] || { echo "::error::Effect cache key: no compiler file found"; exit 1; }
        echo "Effect cache key: $(wc -l <<< "$files" | tr -d ' ') compiler files"
        compiler=$( { echo "$files"; cat "$RUNNER_TEMP/effect-cache-packages.txt"; } | sha256sum | cut -c1-64)
        if [ "${{ inputs.fxc }}" = true ]; then
          # The x64 copy, the one the tests load
          fxc_dll="/c/Program Files (x86)/Windows Kits/10/Redist/D3D/x64/d3dcompiler_47.dll"
          [ -f "$fxc_dll" ] || { echo "::error::FXC not found: $fxc_dll"; exit 1; }
          compiler="$compiler-fxc$(sha256sum < "$fxc_dll" | cut -c1-12)"
        fi
        echo "STRIDE_EFFECT_CACHE_PREFIX=effect-cache-${{ runner.os }}-${{ inputs.lane }}-$compiler-" >> "$GITHUB_ENV"
    - name: Restore the effect cache
      if: inputs.mode == 'restore' && env.STRIDE_EFFECT_CACHE_PREFIX != ''
      uses: actions/cache/restore@v6
      with:
        path: bin/Tests/*/*/*/cache
        key: ${{ env.STRIDE_EFFECT_CACHE_PREFIX }}${{ github.sha }}
        restore-keys: ${{ env.STRIDE_EFFECT_CACHE_PREFIX }}
    - name: Count the effect cache files
      id: count
      shell: bash
      run: |
        # No globstar: macOS runs bash 3.2
        shopt -s nullglob
        caches=(bin/Tests/*/*/*/cache)
        count=0
        if [ ${#caches[@]} -gt 0 ]; then count=$(find "${caches[@]}" -type f | wc -l | tr -d ' '); fi
        if [ "${{ inputs.mode }}" = restore ]; then
          echo "Effect cache: $count files restored"
          echo "STRIDE_EFFECT_CACHE_FILES=$count" >> "$GITHUB_ENV"
        else
          echo "Effect cache: $count files, $STRIDE_EFFECT_CACHE_FILES restored"
          echo "grew=$([ "$count" -gt "${STRIDE_EFFECT_CACHE_FILES:-0}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        fi
    - name: Save the effect cache
      if: inputs.mode == 'save' && env.STRIDE_EFFECT_CACHE_PREFIX != '' && github.event_name != 'pull_request' && steps.count.outputs.grew == 'true'
      uses: actions/cache/save@v6
      with:
        path: bin/Tests/*/*/*/cache
        key: ${{ env.STRIDE_EFFECT_CACHE_PREFIX }}${{ github.sha }}
