name: AI release notes
description: >-
  Generate release notes from git history with Claude, scoped to a product's source paths.
  Best-effort: on any failure (no API key, no range, error) it no-ops. Either writes the
  release body (apply) or just emits the notes file (notes-file output) for review.

inputs:
  tag:
    description: Release tag to edit when apply=true, and the base for deriving the previous tag.
    required: false
    default: ''
  to:
    description: Range end ref (tag/SHA/branch). Defaults to `tag`, else HEAD.
    required: false
    default: ''
  from:
    description: Range start ref (tag/SHA). Defaults to the previous tag matching `tag-match`.
    required: false
    default: ''
  tag-match:
    description: git tag glob to derive `from` when not given (e.g. 'releases/*').
    required: false
    default: ''
  product:
    description: Human-readable product name (e.g. 'the Stride CLI').
    required: true
  scope:
    description: Pathspec limiting commits to this product's sources. Empty = whole repo.
    required: false
    default: ''
  apply:
    description: Write the generated bullet notes to the `tag` release body.
    required: false
    default: 'false'
  add-contributors:
    description: Append GitHub's "New Contributors" section (repo-wide; needs tag refs; best-effort).
    required: false
    default: 'false'
  model:
    description: Claude model id.
    required: false
    default: claude-sonnet-5
  prompt-file:
    description: Prompt template path. Defaults to release-notes-prompt.md beside this action.
    required: false
    default: ''
  anthropic-api-key:
    description: Anthropic API key. If empty, the action no-ops.
    required: false
    default: ''
  github-token:
    description: Token for gh (release view, and release edit when apply=true).
    required: true

outputs:
  notes-file:
    description: Path to the generated bullet-list release notes (empty if it no-oped).
    value: ${{ steps.gen.outputs.notes-file }}
  highlights-file:
    description: Path to the generated highlights draft (empty if none was produced).
    value: ${{ steps.gen.outputs.highlights-file }}

runs:
  using: composite
  steps:
    - id: gen
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        INPUT_TO: ${{ inputs.to }}
        INPUT_FROM: ${{ inputs.from }}
        TAG_MATCH: ${{ inputs.tag-match }}
        PRODUCT: ${{ inputs.product }}
        SCOPE: ${{ inputs.scope }}
        APPLY: ${{ inputs.apply }}
        ADD_CONTRIBUTORS: ${{ inputs.add-contributors }}
        MODEL: ${{ inputs.model }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
      run: |
        set -euo pipefail
        PROMPT_FILE="${PROMPT_FILE:-$GITHUB_ACTION_PATH/release-notes-prompt.md}"

        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "::notice::No ANTHROPIC_API_KEY; skipping note generation."; exit 0
        fi

        # Resolve the commit range: FROM..TO.
        TO="${INPUT_TO:-${TAG:-HEAD}}"
        FROM="$INPUT_FROM"
        if [ -z "$FROM" ] && [ -n "$TAG_MATCH" ]; then
          # Default 'from' baseline for the notes:
          #  - a prerelease (4.4.0-beta5) uses the nearest previous release of any kind
          #    (usually the previous prerelease 4.4.0-beta4; for the first prerelease of a
          #    version, the previous stable), giving incremental "what's new" notes;
          #  - a stable release (4.4.0) uses the previous STABLE release (4.3.0.2507),
          #    skipping the intermediate prereleases.
          case "${TO##*/}" in
            *-*)
              FROM=$(git describe --tags --abbrev=0 --match "$TAG_MATCH" "$TO^" 2>/dev/null || true) ;;
            *)
              for cand in $(git tag --list "$TAG_MATCH" --merged "$TO" --sort=-creatordate 2>/dev/null); do
                [ "$cand" = "$TO" ] && continue
                case "${cand##*/}" in *-*) continue ;; esac
                FROM="$cand"; break
              done ;;
          esac
          # Last resort (no stable ancestor): nearest matching tag of any kind.
          [ -z "$FROM" ] && FROM=$(git describe --tags --abbrev=0 --match "$TAG_MATCH" "$TO^" 2>/dev/null || true)
        fi
        if [ -z "$FROM" ]; then
          echo "::notice::No 'from' ref given or derivable; nothing to generate."; exit 0
        fi
        echo "::notice::Generating notes for $FROM..$TO"

        # GitHub's own generated changelog for this range. It is the authoritative source of
        # each change's PR link and author handle, and of the "New Contributors" section.
        # Best-effort: it needs resolvable tag refs, so it is empty for arbitrary SHA ranges.
        GN_BODY=$(gh api --method POST "repos/$REPO/releases/generate-notes" \
          -f tag_name="$TO" -f previous_tag_name="$FROM" --jq '.body' 2>/dev/null || true)

        # Pull the "What's Changed" list (title + @handle + PR link per line) as the ground
        # truth for bullet attribution.
        WHATS_CHANGED=$(printf '%s\n' "$GN_BODY" | awk '
            /^## What.s Changed/ { c=1; next }
            c && /^\*\*Full Changelog/ { exit }
            c && /^## / { exit }
            c { print }')
        if printf '%s\n' "$WHATS_CHANGED" | grep -q '^\* '; then
          # generate-notes is repo-wide. For a scoped product it is only an attribution
          # lookup (the scoped git log stays the inclusion list); unscoped, it is the
          # authoritative source of what shipped and its attribution.
          if [ -n "$SCOPE" ]; then
            INTRO="GitHub's repo-wide list of merged pull requests for this range is below. It is NOT your inclusion list (the scoped git log decides what to include). Use it only to look up the correct PR link and author handle for a change you have already selected, matching by title. If a selected change isn't in this list, attribute it from its own commit instead."
          else
            INTRO="GitHub already generated the authoritative list of merged pull requests for this range below. Treat it as the source of truth for every change's title, pull-request reference, and author handle. In bullet output, preserve each entry's \`by @handle in <pr>\` attribution exactly; do not invent, renumber, reassign, or drop the handle. Still read the git log to understand, group, and filter the changes."
          fi
          GH_CHANGELOG=$(printf '%s\n\n%s' "$INTRO" "$WHATS_CHANGED")
        else
          GH_CHANGELOG="(No pre-built pull-request list is available for this range. Derive the changes from the git log below; PR links and author handles may be omitted when the commit messages don't contain them.)"
        fi

        # Scope note + starting git-log command the prompt tells Claude to run.
        if [ -n "$SCOPE" ]; then
          SCOPE_NOTE="This is a release of **$PRODUCT**. Base your commit list on the scoped \`git log\` below (pathspec: \`$SCOPE\`); it is already limited to the paths that belong to $PRODUCT. Ignore anything outside that scope — the other products (engine, CLI, VS package, launcher) ship their own separate releases and notes."
          LOG_CMD="git log --no-merges --pretty=format:'%H%x09%s' $FROM..$TO -- $SCOPE"
        else
          SCOPE_NOTE="This release covers the whole $PRODUCT; consider every commit in the range."
          LOG_CMD="git log --no-merges --pretty=format:'%H%x09%s' $FROM..$TO"
        fi

        # Convert bare GitHub PR/commit URLs to portable markdown links ([#NNNN](url),
        # [shortsha](url)) so refs render as links in any viewer, not only GitHub's release
        # UI. Skips URLs already inside a markdown link; leaves compare/other URLs alone.
        linkify() {
          perl -pe 's{(?<!\]\()https://github\.com/([\w.-]+/[\w.-]+)/pull/(\d+)}{[#$2](https://github.com/$1/pull/$2)}g; s{(?<!\]\()https://github\.com/([\w.-]+/[\w.-]+)/commit/([0-9a-f]{7,40})}{"[".substr($2,0,7)."](https://github.com/$1/commit/$2)"}ge'
        }

        # For each direct-commit credit (a parenthetical that opens with a commit URL, i.e. no
        # PR), resolve the commit AUTHOR's GitHub login and insert it: (@login, <url>). Skip
        # (leave the commit id alone) when the author has no linked GitHub account. Must run
        # before linkify, while the commit URLs are still bare. Rewrites the file in place.
        attribute_commits() {
          local file="$1" sha login map="$PWD/commit-authors.tsv"
          : > "$map"
          for sha in $(grep -oE '/commit/[0-9a-f]{7,40}' "$file" | grep -oE '[0-9a-f]{7,40}$' | sort -u); do
            login=$(gh api "repos/$REPO/commits/$sha" --jq '.author.login // empty' 2>/dev/null || true)
            [ -n "$login" ] && printf '%s\t%s\n' "$sha" "$login" >> "$map"
          done
          COMMIT_MAP="$map" perl -i -pe '
            BEGIN { our %A; if (open my $f, "<", $ENV{COMMIT_MAP}) { while (<$f>) { chomp; my ($s,$l) = split /\t/; $A{$s} = $l if $s; } } }
            s{\((https://github\.com/[\w.-]+/[\w.-]+/commit/([0-9a-f]{7,40}))}{ my $l = $A{$2}; $l ? "(\@$l, $1" : "($1" }ge;
          ' "$file"
        }

        # Collapse a run of 2+ commit URLs in one credit into a single range link
        # [oldshort..newshort](compare/parent...new) — but ONLY when git confirms the commits
        # form an unbroken chain, so a range never silently includes unrelated commits.
        # Non-contiguous runs are left as a list. Runs before linkify (URLs still bare).
        collapse_commit_ranges() {
          local file="$1" line tmp
          tmp="$file.tmp"
          : > "$tmp"
          while IFS= read -r line || [ -n "$line" ]; do
            local -a urls shas
            mapfile -t urls < <(printf '%s\n' "$line" | grep -oE 'https://github\.com/[^ )]+/commit/[0-9a-f]{7,40}' || true)
            if [ "${#urls[@]}" -ge 2 ]; then
              local u s ordered oldest newest parent
              shas=(); for u in "${urls[@]}"; do shas+=("${u##*/commit/}"); done
              ordered=$(for s in "${shas[@]}"; do printf '%s %s\n' "$(git show -s --format=%ct "$s" 2>/dev/null || echo 0)" "$s"; done | sort -n | awk '{print $2}')
              oldest=$(printf '%s\n' "$ordered" | head -1)
              newest=$(printf '%s\n' "$ordered" | tail -1)
              parent=$(git rev-parse "${oldest}^" 2>/dev/null || true)
              if [ -n "$oldest" ] && [ -n "$newest" ] && [ -n "$parent" ] \
                 && [ "$(git rev-list --count "${parent}..${newest}" 2>/dev/null || echo 0)" = "${#urls[@]}" ]; then
                local os ns link run
                os=${oldest:0:7}; ns=${newest:0:7}  # 7-char to match linkify's commit shorthand
                link="[$os..$ns](https://github.com/$REPO/compare/$parent...$newest)"
                # Replace the exact "url1, url2, ..." run (in the order it appears) so the
                # collapse only fires on a genuinely consecutive commit list, never swallowing
                # an interleaved PR reference. The range bounds above are date-sorted, so the
                # model's list order does not matter.
                run=$(printf '%s, ' "${urls[@]}"); run="${run%, }"
                line=$(RUN="$run" LINK="$link" perl -pe 's{\Q$ENV{RUN}\E}{$ENV{LINK}}g' <<<"$line")
              fi
            fi
            printf '%s\n' "$line" >> "$tmp"
          done < "$file"
          mv "$tmp" "$file"
        }

        # generate <format> <output-file>: build the prompt for that format, run Claude, and
        # write the model's markdown (chatty preamble stripped) to <output-file>. The caller
        # wraps it with the section scaffolding. Returns non-zero (no file) on failure.
        generate() {
          local fmt="$1" out="$2" FMT PROMPT STREAM status NOTES
          case "$fmt" in
            bullets)
              FMT="Output an **exhaustive bullet list** of every user-facing change, grouped under \`###\` area subheadings each led by an emoji (for example \`### 🎮 Graphics & Shaders\`, \`### 🧨 Physics\`, \`### 🖥️ Editor / Game Studio\`, \`### 🐧 Cross-platform / CLI / Build\`); pick subheadings that fit the actual changes. Put pure-internal work in a final \`### 🔧 Under the hood\` subheading (alongside the other area subheadings) with **several separate \`-\` bullets**, one per grouped topic — never join items into one comma- or semicolon-separated bullet. Do not emit a \`## What's Changed\` heading, a document title, an intro sentence, or a footer: start directly with the first \`###\` subheading. End each bullet with a parenthesized credit and **no trailing period**: for a change with a PR, \`(@handle, <pr-url>)\` where the handle and the pull-request URL come verbatim from the authoritative change list; for a change with only a direct commit (no PR), \`(<commit-url>)\` with **no** handle (the workflow fills in the author), listing each commit URL when several belong to one entry. Never invent a handle or reference."
              ;;
            *)
              FMT="Output a **draft of the release highlights** for a human editor to refine, in the style of Stride's published release notes (https://github.com/stride3d/stride-docs). Cover only a **small, curated set** of the most significant user-facing changes: major features, significant reworks, notable new capabilities. **Skip routine bug fixes and minor changes.** Write each highlight as a \`### Short descriptive title\` (no emoji) followed by one to three short prose **paragraphs** on what it is and why it matters to a developer. Do **not** use bullet points, and do **not** add attribution, PR links, or an \"Under the hood\" section. Start directly with the first \`###\` title. If the release has nothing significant (only small fixes), say so in one sentence."
              ;;
          esac

          # Literal placeholder substitution (no eval).
          PROMPT="$(cat "$PROMPT_FILE")"
          PROMPT="${PROMPT//\$PRODUCT/$PRODUCT}"
          PROMPT="${PROMPT//\$REPO/$REPO}"
          PROMPT="${PROMPT//\$PREV/$FROM}"
          PROMPT="${PROMPT//\$TAG/$TO}"
          PROMPT="${PROMPT//\$SCOPE_NOTE/$SCOPE_NOTE}"
          PROMPT="${PROMPT//\$LOG_CMD/$LOG_CMD}"
          PROMPT="${PROMPT//\$FORMAT_INSTRUCTION/$FMT}"
          PROMPT="${PROMPT//\$GH_CHANGELOG/$GH_CHANGELOG}"

          # Stream events so the log shows live progress; tee the stream to a file and
          # extract the final result from it.
          STREAM="$PWD/claude-$fmt.jsonl"
          echo "Running Claude ($fmt) for $FROM..$TO (large ranges can take a few minutes)..."
          set +e
          claude -p "$PROMPT" \
            --model "$MODEL" \
            --allowedTools 'Bash(git:*),Bash(gh release view:*),Read,Grep,Glob' \
            --max-turns 60 \
            --verbose \
            --output-format stream-json < /dev/null \
            | tee "$STREAM" \
            | jq -r --unbuffered '
                if .type=="assistant" then (.message.content[]?
                  | if .type=="tool_use" then "  -> " + .name + ": " + ((.input.command // .input.file_path // .input.pattern // (.input|tostring))|tostring|gsub("\\s+";" "))
                    elif (.type=="text" and (.text|length)>0) then "  .. " + ((.text|gsub("\\s+";" "))[0:220])
                    else empty end)
                elif .type=="result" then "  == done"
                else empty end' 2>/dev/null
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Claude run ($fmt) failed ($status)."; return 1
          fi
          NOTES=$(jq -rs '[.[] | select(.type=="result")] | last | .result // empty' "$STREAM")
          if [ -z "$NOTES" ]; then
            echo "::warning::Empty $fmt notes."; return 1
          fi
          # Drop any chatty preamble the model emitted before the first markdown-structural
          # line (heading, bullet, numbered item, or HTML comment).
          printf '%s\n' "$NOTES" | awk 'p{print;next} /^(#|[-*] |[0-9]+\. |<!--)/{p=1;print}' > "$out"
          [ -s "$out" ] || { echo "::warning::Empty $fmt notes after cleanup."; return 1; }
        }

        # Install the Claude Code CLI once (native installer -> ~/.local/bin).
        curl -fsSL https://claude.ai/install.sh | bash
        export PATH="$HOME/.local/bin:$PATH"

        # --- Bullet list ("## What's Changed"): the release body that gets applied. ---
        BULLETS="$PWD/bullets-raw.md"
        if ! generate bullets "$BULLETS"; then
          echo "::warning::No notes produced."; exit 0
        fi
        attribute_commits "$BULLETS"      # fill in @author for direct-commit credits (before linkify)
        collapse_commit_ranges "$BULLETS" # collapse contiguous commit runs into a range (before linkify)

        # New Contributors block (repo-wide; from the changelog fetched above).
        CONTRIB=""
        if [ "$ADD_CONTRIBUTORS" = "true" ]; then
          CONTRIB=$(printf '%s\n' "$GN_BODY" | awk '
                /^## New Contributors/ { c=1 }
                c && /^\*\*Full Changelog/ { exit }
                c && /^## / && !/^## New Contributors/ { exit }
                c { print }')
          [ -n "$CONTRIB" ] && echo "::notice::Appended New Contributors section." || echo "::notice::No New Contributors section to append."
        fi

        # Assemble the body: one "What's Changed" section (auto note + provenance comment, the
        # grouped bullets), then New Contributors and the Full Changelog link. linkify rewrites
        # PR/commit URLs to portable [#NNNN](url) links (the compare link is left as-is).
        OUT="$PWD/ai-release-notes.md"
        {
          echo "## What's Changed"
          echo
          echo "_Auto-generated; a maintainer may hand-edit._"
          echo "<!-- Generated by the ai-release-notes action from $FROM..$TO. -->"
          echo
          cat "$BULLETS"
          if [ -n "$CONTRIB" ]; then
            echo
            printf '%s\n' "$CONTRIB"
          fi
          echo
          echo "**Full Changelog**: https://github.com/$REPO/compare/$FROM...$TO"
        } | linkify > "$OUT"

        echo "notes-file=$OUT" >> "$GITHUB_OUTPUT"

        if [ "$APPLY" = "true" ] && [ -n "$TAG" ]; then
          if gh release edit "$TAG" --notes-file "$OUT"; then
            echo "::notice::Applied generated notes to release $TAG."
          else
            echo "::warning::Could not write notes to release $TAG (left as-is)."
          fi
        else
          echo "::notice::Generated notes at $OUT (apply=$APPLY); not written to a release."
        fi

        # --- Highlights draft ("## Highlights"): candidate highlights, never applied. ---
        HLRAW="$PWD/highlights-raw.md"
        HL=""
        if generate highlights "$HLRAW"; then
          HL="$PWD/ai-highlights-draft.md"
          {
            echo "## Highlights"
            echo
            echo "<!-- Auto-generated draft; cherry-pick and rewrite, then place above What's Changed. -->"
            echo
            cat "$HLRAW"
          } | linkify > "$HL"
          echo "highlights-file=$HL" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::No highlights draft produced."
        fi

        # Preserve both outputs in the run step summary so they survive any later hand-edit of
        # the release body. Each output already carries its own section heading.
        {
          echo "_Preserved snapshot of this run's auto-generated notes (kept even if the release body is later edited)._"
          echo
          if [ -n "$HL" ]; then cat "$HL"; else echo "## Highlights"; echo; echo "_(none generated)_"; fi
          echo
          echo "---"
          echo
          cat "$OUT"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
