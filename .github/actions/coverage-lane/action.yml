name: Coverage report of a test lane
description: >-
  Merges the Cobertura files of a test lane's dotnet test run into one with ReportGenerator, writes the coverage
  summary to the step summary, and uploads the Cobertura as the coverage-<lane> artifact, which coverage-report.yml
  merges across the lanes. Does nothing when the run left no coverage file.

inputs:
  lane:
    description: Name of the lane in the artifact name (coverage-<lane>), as in its test-results artifact
    required: true
  title:
    description: Title of the step summary section
    required: true
  results-directory:
    description: The --results-directory of the dotnet test run
    default: TestResults

runs:
  using: composite
  steps:
    # ReportGenerator as a pinned dotnet tool rather than its action: the same command runs locally, and no further
    # third-party action is needed. No HTML report: for a lane with the full filter it takes minutes to write and 1.6 GB
    # to upload. The method coverage row of the summary only links to ReportGenerator Pro.
    - name: Coverage report
      id: report
      shell: pwsh
      env:
        RESULTS_DIRECTORY: ${{ inputs.results-directory }}
        REPORT_TITLE: ${{ inputs.title }}
        JOB_STATUS: ${{ job.status }}
        REPORTGENERATOR_VERSION: 5.4.18
      run: |
        $reports = @(Get-ChildItem $env:RESULTS_DIRECTORY -Recurse -Filter *.cobertura.xml -ErrorAction SilentlyContinue)
        if ($reports.Count -eq 0) { Write-Host "No coverage file found."; exit 0 }
        $tools = Join-Path $env:RUNNER_TEMP reportgenerator
        dotnet tool install dotnet-reportgenerator-globaltool --version $env:REPORTGENERATOR_VERSION --tool-path $tools
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $output = Join-Path $env:RUNNER_TEMP coverage-report
        & (Join-Path $tools reportgenerator) `
          "-reports:$(($reports.FullName) -join ';')" `
          "-targetdir:$output" `
          "-reporttypes:Cobertura;MarkdownSummaryGithub"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # The commit the lane tested: on a PR, the merge commit, whose first parent is the base coverage-report.yml
        # compares with
        git rev-parse HEAD | Set-Content (Join-Path $output commit.txt)
        # The effect cache files the lane restored (.github/actions/effect-cache), when it has one: with none, the
        # tests compile every shader, which covers more of the compiler. The lane table of the report shows it.
        if ($env:STRIDE_EFFECT_CACHE_FILES) { $env:STRIDE_EFFECT_CACHE_FILES | Set-Content (Join-Path $output effect-cache.txt) }
        # Whether the steps before this one, the tests among them, succeeded: the report compares a base run's lane
        # only when they did
        $env:JOB_STATUS | Set-Content (Join-Path $output job-status.txt)
        $summary = Get-Content (Join-Path $output SummaryGithub.md) | Select-Object -Skip 1 | Where-Object { $_ -notmatch 'Method coverage:' }
        @("## Coverage: $env:REPORT_TITLE") + $summary | Add-Content $env:GITHUB_STEP_SUMMARY
        "directory=$output" >> $env:GITHUB_OUTPUT
    - name: Upload coverage
      if: steps.report.outputs.directory != ''
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ inputs.lane }}
        path: ${{ steps.report.outputs.directory }}
