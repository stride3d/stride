name: "Dep: Symbols Pre-release"

# Keeps the debug files of a dependency build (.pdb, .so.debug, .dSYM) as a GitHub pre-release, after the
# run's artifacts expire. The shipped binaries are stripped, and a later rebuild gives debug files that don't match them.
# The calling workflow uploads them as artifacts named symbols-<name>-<rid>, and its VERSION.txt in another artifact.
# The pre-release goes to the repository of the run: a build on a fork keeps its debug files on the fork.

on:
  workflow_call:
    inputs:
      name:
        description: Name of the dependency, in the tag deps/<name>/<version> and the artifact names symbols-<name>-<rid>
        required: true
        type: string
      version:
        description: Version of the build, unique for the dependency
        required: true
        type: string
      notes-artifact:
        description: Name of the artifact whose VERSION.txt becomes the release notes
        required: true
        type: string
  # For a package published by running dep-publish.yml by hand
  workflow_dispatch:
    inputs:
      run-id:
        description: Run of the dep-* workflow that built the package
        required: true
        type: string
      name:
        description: Name of the dependency, in the tag deps/<name>/<version> and the artifact names symbols-<name>-<rid>
        required: true
        type: string
      version:
        description: Version of the build, unique for the dependency
        required: true
        type: string
      notes-artifact:
        description: Name of the artifact whose VERSION.txt becomes the release notes
        required: true
        type: string

run-name: Symbols of ${{ inputs.name }} ${{ inputs.version }} from run ${{ inputs.run-id }}

jobs:
  release:
    name: Create symbols pre-release
    runs-on: ubuntu-24.04
    permissions:
      actions: read # the artifacts of another run
      contents: write
    env:
      RUN_ID: ${{ inputs.run-id || github.run_id }}
    steps:
      # Each artifact goes in a folder of its own, named after it. download-artifact with a pattern extracts a single
      # match without that folder (spirv_to_dxil has one RID).
      - name: Download symbols
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq ".artifacts[] | select(.name | startswith(\"symbols-$NAME-\")) | .name")
          [ -n "$names" ] || { echo "::error::No symbols-$NAME-* artifact in run $RUN_ID"; exit 1; }
          for artifact in $names; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "symbols/$artifact"
          done

      - name: Download VERSION.txt
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.notes-artifact }}
          path: notes
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      # One zip per RID: the files of each RID have the same names. The tag is on the commit the run built.
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          target=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          cd symbols
          for dir in */; do (cd "$dir" && zip -r "../${dir%/}.zip" .); done
          { echo '```'; cat ../notes/VERSION.txt; echo '```'; } > ../notes.md
          gh release create "deps/$NAME/$VERSION" *.zip \
            --repo "$GITHUB_REPOSITORY" --target "$target" \
            --prerelease --latest=false \
            --title "$NAME $VERSION debug files" \
            --notes-file ../notes.md
