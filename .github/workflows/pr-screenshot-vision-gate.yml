name: Screenshot Vision Gate

# Trusted re-judge of frames a keyless screenshot run deferred. Fork PRs get no ANTHROPIC_API_KEY, so
# the screenshot suite captures + LPIPS-scores there and marks borderline frames "deferred" instead of
# failing. This workflow runs in base context (has the key) on the BASE checkout (trusted comparator),
# over the PR's uploaded image artifacts and the PR's own gold images — data only, so no PR-built code
# ever runs with the key. It posts a "Screenshot Vision Gate" status on the PR head; mark it required
# to make deferrals blocking.

on:
  workflow_run:
    workflows: ["PR Label Suites", "Test End-User", "Test GameStudio (Screenshots)"]
    types: [completed]

permissions:
  contents: read
  actions: read       # download artifacts from the triggering run
  statuses: write     # post the gate status on the PR head

jobs:
  vision-gate:
    # Only PR-triggered runs carry a PR head to post a check on. Dispatch/schedule runs of Test End-User
    # are trusted and keyed (nothing gets deferred), so they need no gate.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # Base checkout: trusted comparator source and vision prompts — pinned EXPLICITLY to the repo
      # default branch, never the PR. This is the key-exfiltration boundary: the gate runs with
      # ANTHROPIC_API_KEY in scope, so it must execute only trusted (base) code over the PR's uploaded
      # image artifacts (data). Do NOT change this ref to github.event.workflow_run.head_sha/head_branch —
      # that would run fork-controlled code with the secret, and a fork mustn't be able to swap the
      # comparator to pass a regression either.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          lfs: true

      # Golds from the PR itself, so a PR updating a baseline can pass before merge. Data only: sparse
      # image folders, nothing executed, no token persisted. A changed gold is a binary diff reviewed
      # with the PR. Falls back to the base golds on failure.
      - name: Check out the PR's gold images
        id: pr-golds
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr-golds
          persist-credentials: false
          allow-unsafe-pr-checkout: true   # images only, nothing from it is executed
          lfs: true
          sparse-checkout: |
            tests/editor/Stride.Editor.Tests/baselines
            tests/editor/baselines
            tests/enduser/Stride.Samples.Tests/Fixtures

      - name: Download screenshot artifacts from the triggering run
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: screenshots-*
          path: artifacts

      - name: Re-judge deferred frames (vision tiebreak)
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SCREENSHOTS }}
          DOTNET_NUGET_SIGNATURE_VERIFICATION: "false"
          # Event data through the environment, never spliced into the script
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cli="tests/infra/Stride.ScreenshotComparator.VisionGate/Stride.ScreenshotComparator.VisionGate.csproj"
          rc=0
          shopt -s nullglob
          captured=false
          # Failed frames, one per line, for the status description
          failures="$RUNNER_TEMP/vision-gate-failures.txt"
          : > "$failures"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

          # Golds from the PR when its checkout succeeded, else the base ones. The summary links to the ones used.
          if [ "${{ steps.pr-golds.outcome }}" = "success" ]; then
            golds="pr-golds"
            golds_url="https://github.com/$HEAD_REPO/blob/$HEAD_SHA"
          else
            echo "::warning::PR gold checkout failed; judging against the base golds"
            golds="."
            golds_url="https://github.com/$GITHUB_REPOSITORY/blob/$(git rev-parse HEAD)"
          fi
          report=(--summary "$GITHUB_STEP_SUMMARY" --failures "$failures")

          # Enduser sample captures → committed sample fixtures as gold (gameplay vision prompt).
          enduser_baseline="$golds/tests/enduser/Stride.Samples.Tests/Fixtures"
          for d in artifacts/*/screenshot-out artifacts/*/screenshot-out-aot; do
            [ -d "$d" ] || continue
            captured=true
            echo "::group::vision gate over $d"
            dotnet run --project "$cli" -nr:false -v:m -p:WarningLevel=0 -- \
              --new "$d" --baseline "$enduser_baseline" "${report[@]}" \
              --baseline-url "$golds_url/tests/enduser/Stride.Samples.Tests/Fixtures" || rc=1
            echo "::endgroup::"
          done

          # Editor captures → per-DPI editor baselines (the capture dir name encodes the DPI bucket,
          # e.g. ui-test-out-dpi100 → tests/editor/Stride.Editor.Tests/baselines/dpi100). Uses the editor vision prompt.
          # PRs branched before the editor tests moved have them in tests/editor/baselines.
          editor_baselines=tests/editor/Stride.Editor.Tests/baselines
          [ -d "$golds/$editor_baselines" ] || editor_baselines=tests/editor/baselines
          for d in artifacts/*/ui-test-out-dpi*; do
            [ -d "$d" ] || continue
            dpi="${d##*ui-test-out-}"   # ui-test-out-dpi100 → dpi100
            # $dpi comes from a fork-controlled artifact dir name and feeds the baseline path below,
            # so constrain it — a crafted name must not traverse out of the baselines folder.
            if [[ ! "$dpi" =~ ^dpi[0-9]+$ ]]; then
              echo "::warning::skipping artifact dir with unexpected DPI token: $d"
              continue
            fi
            captured=true
            echo "::group::vision gate over $d (baseline dpi=$dpi)"
            dotnet run --project "$cli" -nr:false -v:m -p:WarningLevel=0 -- \
              --new "$d" --baseline "$golds/$editor_baselines/$dpi" --prompt editor "${report[@]}" \
              --baseline-url "$golds_url/$editor_baselines/$dpi" || rc=1
            echo "::endgroup::"
          done

          # Under the tables, when a frame was judged
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "Captures: the artifacts of the [screenshot run]($RUN_URL), or"
              echo
              echo '```'
              echo "gh run download $RUN_ID -R $GITHUB_REPOSITORY -n <artifact>"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$captured" = false ]; then
            # No screenshots-* artifacts → no screenshot suite ran (or it ran with nothing deferred):
            # nothing to re-judge, so pass. This keeps the gate green on ordinary PRs so it's safe to
            # mark required. It can't hide a regression: deferred frames always ship an uploaded
            # vision-deferred.json, and a capture failure fails the suite itself.
            echo "::notice::no screenshot artifacts from the triggering run — nothing to gate (pass)"
          fi
          echo "result=$rc" >> "$GITHUB_OUTPUT"

      # Posted as a commit status (not a Checks API run) so it shows as its own entry on the PR
      # instead of nesting under an arbitrary unrelated workflow's check suite. target_url points at
      # this gate run — where the actual re-judge log lives.
      - name: Post gate status on PR head
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const ok = '${{ steps.gate.outputs.result }}' === '0';
            // Names the failed frames (read from the file, as they come from the PR's artifacts); a status
            // description holds 140 characters
            const fs = require('fs');
            const file = '${{ steps.gate.outputs.failures }}';
            const failed = file && fs.existsSync(file)
              ? [...new Set(fs.readFileSync(file, 'utf8').split('\n').map(x => x.trim()).filter(x => x))]
              : [];
            let description = ok
              ? 'Deferred frames resolved (or nothing was deferred)'
              : failed.length > 0
                ? `Failed: ${failed.join(', ')}`
                : 'Deferred frame(s) failed the vision re-judge';
            if (description.length > 140)
              description = description.slice(0, 137) + '...';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              context: 'Screenshot Vision Gate',
              state: ok ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description,
            });
            if (!ok) core.setFailed('Screenshot Vision Gate failed');
