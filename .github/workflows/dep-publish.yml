name: "Dep: Sign & Publish"

# Signs a dependency package built by the calling dep-* workflow and pushes it to nuget.org.
# nuget.org's trusted publishing matches the workflow file of the job (job_workflow_ref), which is this file
# when called: one policy for this file covers every dependency.

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the artifact that holds the .nupkg
        required: true
        type: string

jobs:
  publish:
    name: Sign & Publish to NuGet.org
    # Only the canonical repo holds the production environment and the signing secrets;
    # forks validate the build and pack jobs but never attempt to publish.
    if: github.repository == 'stride3d/stride'
    # The sign tool is Windows-only (P/Invokes kernel32)
    runs-on: windows-2025-vs2026
    environment: production
    permissions:
      contents: read
      id-token: write # nuget.org trusted publishing
    steps:
      # The sign tool version is pinned in build/package/dotnet-tools.json: check out only that file
      - uses: actions/checkout@v7
        with:
          sparse-checkout: /build/package/dotnet-tools.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install signing tool
        shell: pwsh
        run: |
          $version = (Get-Content build/package/dotnet-tools.json | ConvertFrom-Json).tools.sign.version
          dotnet tool install sign --tool-path ./sign-tool --version $version

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}

      - name: Sign NuGet package
        shell: pwsh
        run: |
          ./sign-tool/sign code azure-key-vault *.nupkg `
            --description "Stride" `
            --description-url "https://stride3d.net" `
            --publisher-name "Stride" `
            --azure-key-vault-tenant-id "${{ secrets.STRIDE_SIGN_TENANT_ID }}" `
            --azure-key-vault-client-id "${{ secrets.STRIDE_SIGN_CLIENT_ID }}" `
            --azure-key-vault-client-secret "${{ secrets.STRIDE_SIGN_CLIENT_SECRET }}" `
            --azure-key-vault-certificate "${{ secrets.STRIDE_SIGN_KEYVAULT_CERTIFICATE }}" `
            --azure-key-vault-url "https://${{ secrets.STRIDE_SIGN_KEYVAULT_NAME }}.vault.azure.net/" `
            -v Information

      # A short-lived key from nuget.org's trusted publishing policy for this workflow file, instead of a stored one
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.STRIDE_NUGET_USER }}

      - name: Publish
        run: |
          dotnet nuget push *.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
