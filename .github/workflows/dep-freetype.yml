name: "Dep: Build FreeType"

on:
  workflow_dispatch:
    inputs:
      freetype-version:
        description: FreeType version tag (e.g. VER-2-13-3)
        default: VER-2-13-3
        required: true

jobs:
  build-windows:
    name: Build FreeType (Windows)
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ github.event.inputs.freetype-version }}
          path: freetype-src

      - name: Build
        shell: pwsh
        run: |
          cmake -S freetype-src -B freetype-build -A ${{ matrix.arch }} `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DFT_DISABLE_BZIP2=ON `
            -DFT_DISABLE_BROTLI=ON `
            -DFT_DISABLE_HARFBUZZ=ON `
            -DFT_DISABLE_PNG=ON `
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build --config Release

      # The .pdb, when the build makes one, goes to the symbols pre-release: it would ship next to the DLL in every game.
      - name: Collect output
        shell: pwsh
        run: |
          New-Item -Path "out/${{ matrix.rid }}", "symbols/${{ matrix.rid }}" -ItemType Directory -Force
          Copy-Item freetype-build/Release/freetype.dll "out/${{ matrix.rid }}/"
          Copy-Item freetype-build/Release/freetype.pdb "symbols/${{ matrix.rid }}/" -ErrorAction SilentlyContinue

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-freetype-${{ matrix.rid }}
          path: symbols/${{ matrix.rid }}/
          if-no-files-found: ignore

  build-linux:
    name: Build FreeType (Linux x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ github.event.inputs.freetype-version }}
          path: freetype-src

      - name: Build
        run: |
          cmake -S freetype-src -B freetype-build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build -- -j$(nproc)

      - name: Collect output
        run: |
          mkdir -p out/linux-x64
          # Copy the actual shared library (not symlinks) with a versionless name
          cp $(readlink -f freetype-build/libfreetype.so) out/linux-x64/libfreetype.so

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-linux-x64
          path: out/linux-x64/

  build-macos:
    name: Build FreeType (macOS)
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
          - arch: x86_64
            rid: osx-x64
    steps:
      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ github.event.inputs.freetype-version }}
          path: freetype-src

      - name: Build
        run: |
          cmake -S freetype-src -B freetype-build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build -- -j$(sysctl -n hw.ncpu)

      - name: Collect output
        run: |
          mkdir -p out/${{ matrix.rid }}
          # Copy the actual dylib (not symlinks) with a versionless name
          cp $(readlink -f freetype-build/libfreetype.dylib) out/${{ matrix.rid }}/libfreetype.dylib

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

  build-android:
    name: Build FreeType (Android)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            rid: android-arm
          - abi: arm64-v8a
            rid: android-arm64
          - abi: x86
            rid: android-x86
          - abi: x86_64
            rid: android-x64
    steps:
      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ github.event.inputs.freetype-version }}
          path: freetype-src

      - name: Build
        run: |
          cmake -S freetype-src -B freetype-build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build -- -j$(nproc)

      # The NDK toolchain compiles with -g: ship the library without its debug info (the symbol table stays), and
      # keep the full library in the symbols pre-release.
      - name: Collect output
        run: |
          mkdir -p out/${{ matrix.rid }} symbols/${{ matrix.rid }}
          cp freetype-build/libfreetype.so symbols/${{ matrix.rid }}/
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug \
            -o out/${{ matrix.rid }}/libfreetype.so freetype-build/libfreetype.so

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-freetype-${{ matrix.rid }}
          path: symbols/${{ matrix.rid }}/

  build-ios:
    name: Build FreeType (${{ matrix.rid }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: ios-arm64
            sysroot: iphoneos
          - rid: iossimulator-arm64
            sysroot: iphonesimulator
    steps:
      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ github.event.inputs.freetype-version }}
          path: freetype-src

      - name: Build
        run: |
          cmake -S freetype-src -B freetype-build \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sysroot }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build -- -j$(sysctl -n hw.ncpu)

      - name: Collect output
        run: |
          mkdir -p out/${{ matrix.rid }}
          cp freetype-build/libfreetype.a out/${{ matrix.rid }}/

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

  collect:
    name: Collect all platforms
    needs: [build-windows, build-linux, build-macos, build-android, build-ios]
    runs-on: ubuntu-24.04
    env:
      # A FreeType version can be built more than once, as when only the build options change
      SYMBOLS_VERSION: ${{ github.event.inputs.freetype-version }}-run${{ github.run_number }}
    outputs:
      symbols-version: ${{ env.SYMBOLS_VERSION }}
    steps:
      - name: Checkout FreeType (for version info)
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ github.event.inputs.freetype-version }}
          path: freetype-src
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Organize into Option B structure
        run: |
          OUT=freetype-out

          # Desktop + iOS → dotnet/{rid}/
          for rid in win-x64 win-arm64 linux-x64 osx-x64 osx-arm64 ios-arm64 iossimulator-arm64; do
            mkdir -p $OUT/dotnet/$rid
            cp artifacts/freetype-$rid/* $OUT/dotnet/$rid/ 2>/dev/null || true
          done

          # Android → Android/{rid}/
          for rid in android-arm android-arm64 android-x86 android-x64; do
            mkdir -p $OUT/Android/$rid
            cp artifacts/freetype-$rid/* $OUT/Android/$rid/ 2>/dev/null || true
          done

          # Version info
          COMMIT=$(git -C freetype-src rev-parse HEAD)
          URL=$(git -C freetype-src config --get remote.origin.url)
          printf 'FreeType %s\nRepository: %s\nCommit: %s\nStride: %s/%s @ %s\nBuilt: %s\nWorkflow: %s\n' \
            "${{ github.event.inputs.freetype-version }}" \
            "$URL" \
            "$COMMIT" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.sha }}" \
            "$(date -u +%Y-%m-%d)" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > $OUT/VERSION.txt
          # The symbols job creates this pre-release on stride3d/stride only
          if [ "${{ github.repository }}" = stride3d/stride ]; then
            echo "Debug files: ${{ github.server_url }}/${{ github.repository }}/releases/tag/deps/freetype/$SYMBOLS_VERSION" >> $OUT/VERSION.txt
          fi

      - name: List contents
        run: find freetype-out -type f | sort

      - name: Upload combined
        uses: actions/upload-artifact@v7
        with:
          name: freetype-all-platforms
          path: freetype-out/

  symbols:
    needs: collect
    permissions:
      contents: write
    uses: ./.github/workflows/dep-symbols.yml
    with:
      name: freetype
      version: ${{ needs.collect.outputs.symbols-version }}
      notes-artifact: freetype-all-platforms
