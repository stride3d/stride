name: "Dep: Build FreeType"

on:
  workflow_dispatch:
    inputs:
      freetype-version:
        description: FreeType version tag (e.g. VER-2-13-3)
        default: VER-2-13-3
        required: true

# Debug files: every build compiles with debug info, and the libraries ship without it and without their local
# symbols (dep-split-debug.sh). The debug files (.pdb, .so.debug, .dSYM, iOS .a with DWARF) go to the symbols
# pre-release (dep-symbols.yml). CFLAGS and LDFLAGS add to CMake's default flags: /Z7 and -g don't change the generated
# code, and /DEBUG needs /OPT:REF and /OPT:ICF to link as a Release build does.

jobs:
  # The builds check out this one commit, so every RID gets the same sources even when the ref moves during the run.
  resolve:
    name: Resolve FreeType ref and version
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Resolve ref to a commit
        id: resolve
        run: |
          git init -q freetype-src
          git -C freetype-src remote add origin https://github.com/freetype/freetype.git
          git -C freetype-src fetch -q --depth 1 --filter=tree:0 origin "${{ github.event.inputs.freetype-version }}"
          echo "commit=$(git -C freetype-src rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $commit = '${{ steps.resolve.outputs.commit }}'
          $header = (git -C freetype-src show "${commit}:include/freetype/freetype.h") -join "`n"
          $parts = foreach ($part in 'MAJOR', 'MINOR', 'PATCH') {
            $found = [regex]::Matches($header, "(?m)^#define FREETYPE_$part\s+(\d+)\s*$")
            if ($found.Count -ne 1) { throw "include/freetype/freetype.h doesn't define FREETYPE_$part once" }
            $found[0].Groups[1].Value
          }
          stride-src/.github/scripts/dep-version.ps1 -Name freetype -Official ($parts -join '.') `
            -Source freetype-src -Commit $commit -Upstream https://github.com/freetype/freetype.git -TagPrefix VER-

  build-windows:
    name: Build FreeType (Windows)
    needs: resolve
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ needs.resolve.outputs.commit }}
          path: freetype-src

      - name: Build
        shell: pwsh
        env: { CFLAGS: /Z7, LDFLAGS: /DEBUG /OPT:REF /OPT:ICF }
        run: |
          cmake -S freetype-src -B freetype-build -A ${{ matrix.arch }} `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DFT_DISABLE_BZIP2=ON `
            -DFT_DISABLE_BROTLI=ON `
            -DFT_DISABLE_HARFBUZZ=ON `
            -DFT_DISABLE_PNG=ON `
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build --config Release

      # The .pdb isn't committed: it would ship next to the DLL in every game
      - name: Collect output
        shell: pwsh
        run: |
          New-Item -Path "out/${{ matrix.rid }}", "symbols/${{ matrix.rid }}" -ItemType Directory -Force
          Copy-Item freetype-build/Release/freetype.dll "out/${{ matrix.rid }}/"
          Copy-Item freetype-build/Release/freetype.pdb "symbols/${{ matrix.rid }}/"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-freetype-${{ matrix.rid }}
          path: symbols/${{ matrix.rid }}/

  build-linux:
    name: Build FreeType (Linux x64)
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ needs.resolve.outputs.commit }}
          path: freetype-src

      - name: Build
        env: { CFLAGS: -fPIC -g }
        run: |
          cmake -S freetype-src -B freetype-build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build -- -j$(nproc)

      # The actual shared library (not the symlinks), with a versionless name
      - name: Collect output
        run: stride-src/.github/scripts/dep-split-debug.sh freetype-build/libfreetype.so out/linux-x64 symbols/linux-x64

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-linux-x64
          path: out/linux-x64/

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-freetype-linux-x64
          path: symbols/linux-x64/

  build-macos:
    name: Build FreeType (macOS)
    needs: resolve
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
          - arch: x86_64
            rid: osx-x64
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ needs.resolve.outputs.commit }}
          path: freetype-src

      - name: Build
        env: { CFLAGS: -g }
        run: |
          cmake -S freetype-src -B freetype-build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build -- -j$(sysctl -n hw.ncpu)

      # The actual dylib (not the symlinks), with a versionless name
      - name: Collect output
        run: |
          stride-src/.github/scripts/dep-split-debug.sh freetype-build/libfreetype.dylib \
            out/${{ matrix.rid }} symbols/${{ matrix.rid }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-freetype-${{ matrix.rid }}
          path: symbols/${{ matrix.rid }}/

  build-android:
    name: Build FreeType (Android)
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            rid: android-arm
          - abi: arm64-v8a
            rid: android-arm64
          - abi: x86
            rid: android-x86
          - abi: x86_64
            rid: android-x64
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ needs.resolve.outputs.commit }}
          path: freetype-src

      - name: Build
        run: |
          cmake -S freetype-src -B freetype-build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build -- -j$(nproc)

      # The NDK toolchain already compiles with -g
      - name: Collect output
        run: |
          OBJCOPY=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy \
            stride-src/.github/scripts/dep-split-debug.sh freetype-build/libfreetype.so \
            out/${{ matrix.rid }} symbols/${{ matrix.rid }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-freetype-${{ matrix.rid }}
          path: symbols/${{ matrix.rid }}/

  build-ios:
    name: Build FreeType (${{ matrix.rid }})
    needs: resolve
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: ios-arm64
            sysroot: iphoneos
          - rid: iossimulator-arm64
            sysroot: iphonesimulator
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Checkout FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: ${{ needs.resolve.outputs.commit }}
          path: freetype-src

      - name: Build
        env: { CFLAGS: -g }
        run: |
          cmake -S freetype-src -B freetype-build \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sysroot }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON
          cmake --build freetype-build -- -j$(sysctl -n hw.ncpu)

      - name: Collect output
        run: |
          stride-src/.github/scripts/dep-split-debug.sh freetype-build/libfreetype.a \
            out/${{ matrix.rid }} symbols/${{ matrix.rid }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: freetype-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-freetype-${{ matrix.rid }}
          path: symbols/${{ matrix.rid }}/

  collect:
    name: Collect all platforms
    needs: [resolve, build-windows, build-linux, build-macos, build-android, build-ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Organize into Option B structure
        run: |
          OUT=freetype-out

          # Desktop + iOS → dotnet/{rid}/
          for rid in win-x64 win-arm64 linux-x64 osx-x64 osx-arm64 ios-arm64 iossimulator-arm64; do
            mkdir -p $OUT/dotnet/$rid
            cp artifacts/freetype-$rid/* $OUT/dotnet/$rid/ 2>/dev/null || true
          done

          # Android → Android/{rid}/
          for rid in android-arm android-arm64 android-x86 android-x64; do
            mkdir -p $OUT/Android/$rid
            cp artifacts/freetype-$rid/* $OUT/Android/$rid/ 2>/dev/null || true
          done

          # Version info
          printf 'FreeType %s\nVersion: %s\nRepository: %s\nCommit: %s\nStride: %s/%s @ %s\nBuilt: %s\nWorkflow: %s\n' \
            "${{ github.event.inputs.freetype-version }}" \
            "${{ needs.resolve.outputs.version }}" \
            https://github.com/freetype/freetype \
            "${{ needs.resolve.outputs.commit }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.sha }}" \
            "$(date -u +%Y-%m-%d)" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > $OUT/VERSION.txt
          # The symbols job creates this pre-release on stride3d/stride only
          if [ "${{ github.repository }}" = stride3d/stride ]; then
            echo "Debug files: ${{ github.server_url }}/${{ github.repository }}/releases/tag/deps/freetype/${{ needs.resolve.outputs.number }}" >> $OUT/VERSION.txt
          fi

      - name: List contents
        run: find freetype-out -type f | sort

      - name: Upload combined
        uses: actions/upload-artifact@v7
        with:
          name: freetype-all-platforms
          path: freetype-out/

  symbols:
    needs: [resolve, collect]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dep-symbols.yml
    with:
      name: freetype
      version: ${{ needs.resolve.outputs.number }}
      notes-artifact: freetype-all-platforms
