name: "Dep: Build & Deploy Assimp"

# Skeleton workflow: the full implementation lives on a feature branch.
# This exists on master only so the workflow can be triggered with workflow_dispatch
# and the expected inputs. Run it against the feature branch ref for the real build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version (Assimp's version, then a revision of ours, e.g. 6.0.5.1)
        default: 6.0.5.1
        required: true
      ref:
        description: Assimp tag
        default: v6.0.5
        required: true

jobs:
  placeholder:
    name: Skeleton (run on feature branch for real build)
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "This is a skeleton. The real build lives on a feature branch."
          echo "Trigger this workflow against that branch ref to run the actual build."
