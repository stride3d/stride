name: "Dep: Build & Deploy Assimp"

# Builds the Assimp of Stride.Dependencies.Assimp: upstream at a tag, plus the patches in deps/assimp.
# The managed bindings stay Silk.NET.Assimp, so a new Assimp must keep the struct layouts those bindings expect.
#
# Debug files: the package gets the libraries without debug info and local symbols, and the debug files (.pdb,
# .so.debug, .dSYM) go to the symbols pre-release (dep-symbols.yml), as symbols-assimp-<rid> artifacts. On Windows,
# Assimp's own ASSIMP_INSTALL_PDB (on by default) makes the .pdb of its Release build; Linux and macOS add -g to CMake's
# flags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version (leave empty for the Assimp version and the next build number)
        required: false
      ref:
        description: Assimp tag
        default: v6.0.5
        required: true

env:
  CMAKE_OPTIONS: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DASSIMP_BUILD_ZLIB=ON -DASSIMP_WARNINGS_AS_ERRORS=OFF -DASSIMP_BUILD_TESTS=OFF -DASSIMP_BUILD_ASSIMP_TOOLS=OFF

jobs:
  # The builds check out this one commit, so every RID gets the same sources even when the ref moves during the run.
  resolve:
    name: Resolve Assimp ref and version
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: stride-src
          sparse-checkout: |
            deps/assimp
            .github/scripts

      - name: Resolve ref to a commit
        id: resolve
        run: |
          git init -q assimp-src
          git -C assimp-src remote add origin https://github.com/assimp/assimp.git
          git -C assimp-src fetch -q --depth 1 --filter=tree:0 origin "${{ github.event.inputs.ref }}"
          echo "commit=$(git -C assimp-src rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      # The patches of deps/assimp make it a build of ours: the metadata of the version counts them
      - name: Package version
        id: version
        shell: pwsh
        run: |
          $commit = '${{ steps.resolve.outputs.commit }}'
          $cmake = (git -C assimp-src show "${commit}:CMakeLists.txt") -join "`n"
          $found = [regex]::Matches($cmake, '(?m)^PROJECT\(Assimp VERSION (\d+\.\d+\.\d+)$')
          if ($found.Count -ne 1) { throw "CMakeLists.txt doesn't have one line 'PROJECT(Assimp VERSION N.N.N'" }
          $patches = @(Get-ChildItem stride-src/deps/assimp/*.patch).Count
          $marker = @(if ($patches) { "patches-$patches" })
          stride-src/.github/scripts/dep-version.ps1 -Name assimp -PackageId Stride.Dependencies.Assimp -Official $found[0].Groups[1].Value `
            -Source assimp-src -Commit $commit -Upstream https://github.com/assimp/assimp.git `
            -TagPrefix v -Marker $marker -Override '${{ github.event.inputs.version }}'

  build-windows:
    name: Build Assimp (Windows ${{ matrix.arch }})
    needs: resolve
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, rid: win-x64 }
          - { arch: ARM64, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: deps/assimp }

      - uses: actions/checkout@v7
        with:
          repository: assimp/assimp
          ref: ${{ needs.resolve.outputs.commit }}
          path: assimp-src

      - name: Apply patches
        shell: pwsh
        run: Get-ChildItem stride-src/deps/assimp/*.patch | ForEach-Object { git -C assimp-src apply --verbose $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }

      - name: Build
        shell: pwsh
        run: |
          cmake -S assimp-src -B _build -A ${{ matrix.arch }} -Thost=x64 $env:CMAKE_OPTIONS.Split(' ')
          cmake --build _build --config Release --parallel

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assimp-out, assimp-symbols | Out-Null
          # Silk.NET expects the DLL named "Assimp64". The .pdb keeps its name: the DLL names it.
          Copy-Item (Get-Item _build/bin/Release/assimp-*-mt.dll).FullName assimp-out/Assimp64.dll
          Copy-Item (Get-Item _build/bin/Release/assimp-*-mt.pdb).FullName assimp-symbols/
          Copy-Item assimp-src/LICENSE assimp-out/LICENSE

      - uses: actions/upload-artifact@v7
        with: { name: 'assimp-${{ matrix.rid }}', path: assimp-out/ }

      - uses: actions/upload-artifact@v7
        with: { name: 'symbols-assimp-${{ matrix.rid }}', path: assimp-symbols/ }

  build-linux:
    name: Build Assimp (Linux x64)
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: deps/assimp }

      - uses: actions/checkout@v7
        with:
          repository: assimp/assimp
          ref: ${{ needs.resolve.outputs.commit }}
          path: assimp-src

      - name: Apply patches
        run: for patch in stride-src/deps/assimp/*.patch; do git -C assimp-src apply --verbose "$PWD/$patch"; done

      - name: Build
        env: { CFLAGS: -g, CXXFLAGS: -g }
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          cmake -S assimp-src -B _build -G Ninja $CMAKE_OPTIONS
          cmake --build _build

      # The .debug file keeps the debug info and the symbol table. The shipped library names it in its .gnu_debuglink,
      # where gdb and lldb look for it.
      - name: Collect output
        run: |
          mkdir -p assimp-out assimp-symbols
          objcopy --only-keep-debug _build/bin/libassimp.so.6 assimp-symbols/libassimp.so.6.debug
          objcopy --strip-unneeded --add-gnu-debuglink=assimp-symbols/libassimp.so.6.debug \
            _build/bin/libassimp.so.6 assimp-out/libassimp.so.6

      - uses: actions/upload-artifact@v7
        with: { name: assimp-linux-x64, path: assimp-out/ }

      - uses: actions/upload-artifact@v7
        with: { name: symbols-assimp-linux-x64, path: assimp-symbols/ }

  build-macos:
    name: Build Assimp (macOS ARM64)
    needs: resolve
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: deps/assimp }

      - uses: actions/checkout@v7
        with:
          repository: assimp/assimp
          ref: ${{ needs.resolve.outputs.commit }}
          path: assimp-src

      - name: Apply patches
        run: for patch in stride-src/deps/assimp/*.patch; do git -C assimp-src apply --verbose "$PWD/$patch"; done

      - name: Build
        env: { CFLAGS: -g, CXXFLAGS: -g }
        run: |
          brew install ninja || true
          # The system zlib: Assimp's bundled one doesn't compile against the macOS SDK's stdio.h
          cmake -S assimp-src -B _build -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 $CMAKE_OPTIONS -DASSIMP_BUILD_ZLIB=OFF
          cmake --build _build

      # The DWARF stays in the object files: dsymutil collects it. strip -S removes the debug map that points to them,
      # and -x the local symbols. strip breaks the signature, and arm64 needs one: codesign adds an ad-hoc one.
      - name: Collect output
        run: |
          mkdir -p assimp-out assimp-symbols
          dsymutil _build/bin/libassimp.6.dylib -o assimp-symbols/libassimp.6.dylib.dSYM
          strip -S -x -o assimp-out/libassimp.6.dylib _build/bin/libassimp.6.dylib
          codesign -f -s - assimp-out/libassimp.6.dylib

      - uses: actions/upload-artifact@v7
        with: { name: assimp-osx-arm64, path: assimp-out/ }

      - uses: actions/upload-artifact@v7
        with: { name: symbols-assimp-osx-arm64, path: assimp-symbols/ }

  pack:
    name: Pack NuGet ${{ needs.resolve.outputs.number }}
    needs: [resolve, build-windows, build-linux, build-macos]
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with: { pattern: 'assimp-*', path: artifacts }

      - name: Prepare package contents
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64', 'linux-x64', 'osx-arm64') {
            New-Item -ItemType Directory -Force deps/assimp/$rid | Out-Null
            Copy-Item artifacts/assimp-$rid/* deps/assimp/$rid/ -Exclude LICENSE
          }
          New-Item -ItemType Directory -Force deps/assimp/tools | Out-Null
          Copy-Item artifacts/assimp-win-x64/LICENSE deps/assimp/tools/LICENSE.txt

      - name: Write VERSION.txt and README.md
        shell: pwsh
        run: |
          $lines = @(
            "Assimp ${{ github.event.inputs.ref }}"
            "Version: ${{ needs.resolve.outputs.version }}"
            "Repository: https://github.com/assimp/assimp"
            "Commit: ${{ needs.resolve.outputs.commit }}"
            "Patches: $((Get-ChildItem deps/assimp/*.patch).Name -join ', ')"
            ""
            "Stride: ${{ github.server_url }}/${{ github.repository }} @ ${{ github.sha }}"
            "Built: $(Get-Date -AsUTC -Format yyyy-MM-dd)"
            "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          # The symbols job creates this pre-release on stride3d/stride only
          if ('${{ github.repository }}' -eq 'stride3d/stride') {
            $lines += "Debug files: ${{ github.server_url }}/${{ github.repository }}/releases/tag/deps/assimp/${{ needs.resolve.outputs.number }}"
          }
          $lines | Set-Content deps/assimp/tools/VERSION.txt
          $block = @('```') + $lines + @('```')
          $block | Add-Content $env:GITHUB_STEP_SUMMARY
          @(
            "# Stride.Dependencies.Assimp"
            ""
            "Assimp shared library for the Stride 3D importer."
            ""
            "## Build"
            ""
          ) + $block | Set-Content deps/assimp/README.md

      - name: Pack NuGet
        shell: pwsh
        run: |
          $commitHash = '${{ needs.resolve.outputs.commit }}'.Substring(0, 7)
          nuget pack deps/assimp/Stride.Dependencies.Assimp.nuspec `
            -Version "${{ needs.resolve.outputs.version }}" `
            -Properties "ref=${{ github.event.inputs.ref }};commit=$commitHash;strideCommit=${{ github.sha }}" `
            -OutputDirectory nupkg

      - uses: actions/upload-artifact@v7
        with: { name: Stride.Dependencies.Assimp.nupkg, path: nupkg/*.nupkg }

      - uses: actions/upload-artifact@v7
        with: { name: version-assimp, path: deps/assimp/tools/VERSION.txt }

  # Signing and pushing are shared by all dependencies: nuget.org trusts dep-publish.yml
  publish:
    name: Publish ${{ needs.resolve.outputs.number }}
    needs: [resolve, pack]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/dep-publish.yml
    secrets: inherit # without it, the called job gets no secret, not even those of its environment
    with:
      artifact: Stride.Dependencies.Assimp.nupkg

  # After publish: a package that was not published gets no debug files
  symbols:
    needs: [resolve, pack, publish]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dep-symbols.yml
    with:
      name: assimp
      version: ${{ needs.resolve.outputs.number }}
      notes-artifact: version-assimp
