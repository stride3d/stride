name: Release Deploy

# Deploys a previously-built release: downloads the `packages` artifact from a build run, signs it, pushes to NuGet.org,
# tags the built commit, creates the GitHub Release, and opens the next number on the branch. The build has no secrets:
# the signing key is only used here, in production, after a release manager's approval.
#
# Two entry points share one job:
#   - workflow_call: release.yml's Deploy stage calls this with run-id = the current run (the integrated flow).
#   - workflow_dispatch: deploy a *prior* (no-deploy) build by its run id - "build once, test locally, then
#     sign and deploy the exact same artifacts" without a rebuild.
#
# The version is detected from the downloaded packages (not an input), so both entry points behave identically.
# The tag points at the commit the artifacts were *built* from (resolved from the run), even if the branch has
# since moved; the post-release version bump goes to the current branch tip.

on:
  workflow_call:
    inputs:
      run-id:
        description: Run whose 'packages' artifact to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run-id:
        description: Run ID of a prior (no-deploy) release build to deploy
        required: true
        type: string

jobs:
  Deploy:
    runs-on: windows-2025  # the sign tool needs Windows
    environment: production  # Requires manual approval in GitHub settings
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: 1  # Git Bash: keep tag and path arguments as they are
    permissions:
      actions: read  # read the build run and download its packages
      contents: write
      id-token: write # nuget.org trusted publishing
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The Stride Release app's key is only in the production environment, and the app may pass the master ruleset.
      - name: Get the Stride Release token
        id: release
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STRIDE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.STRIDE_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-members: read

      - name: Check release permissions
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
        run: |
          ORG=$(echo "${{ github.repository }}" | cut -d/ -f1)
          TEAM="stride-release-managers"
          USER="${{ github.actor }}"
          if ! gh api "orgs/$ORG/teams/$TEAM/memberships/$USER" --silent 2>/dev/null; then
            echo "::error::User $USER is not a member of $ORG/$TEAM. Deploy requires stride-release-managers team membership."
            exit 1
          fi

      - name: Resolve built commit
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a Release build of this branch: this job signs what it deploys, so it must not take another workflow's
          # artifacts, or a build of a branch anyone with write access could push to.
          read -r SHA WORKFLOW BRANCH < <(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run-id }}" --jq '"\(.head_sha) \(.path) \(.head_branch)"')
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve the commit for run ${{ inputs.run-id }}"
            exit 1
          fi
          if [ "$WORKFLOW" != ".github/workflows/release.yml" ] || [ "$BRANCH" != "${{ github.ref_name }}" ]; then
            echo "::error::Run ${{ inputs.run-id }} is $WORKFLOW on $BRANCH: only a run of .github/workflows/release.yml on ${{ github.ref_name }} can be deployed from here."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying artifacts built from $SHA"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.release.outputs.token }}  # push the tag and the post-release version-bump commit

      - name: Commit as the Stride Release bot
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
          BOT: ${{ steps.release.outputs.app-slug }}[bot]
        run: |
          # The id prefix is what links the author to the bot's profile.
          git config --global user.name "$BOT"
          git config --global user.email "$(gh api "users/$BOT" --jq .id)+$BOT@users.noreply.github.com"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: stride-packages-*
          merge-multiple: true
          path: bin/packages
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Detect version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path bin/packages -Filter "Stride.Core.*.nupkg" | Select-Object -First 1
          if (-not $pkg) {
            echo "::error::No Stride.Core package found in run ${{ inputs.run-id }}"
            exit 1
          }
          $version = $pkg.Name -replace 'Stride\.Core\.(.*?)\.nupkg','$1'
          # Guard against a malformed build slipping a weird version into the package name.
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            echo "::error::Detected package version '$version' is not a valid version"
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "::notice::Package version: $version"

      - name: Guard against re-publishing an existing version
        # The version is the committed value, bumped per release. If it wasn't bumped, its releases/<version> tag
        # already exists on a different commit than the one we're deploying - fail rather than re-publish.
        run: |
          TAG="releases/${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1 && [ -z "$(git tag --points-at ${{ steps.src.outputs.sha }} --list "$TAG")" ]; then
            echo "::error::Version ${{ steps.version.outputs.version }} is already released (tag $TAG on another commit). Bump Patch/NuGetVersionSuffix in SharedAssemblyInfo.cs."
            exit 1
          fi

      # Again here, for a deploy of a build made earlier: a release may have happened since.
      - name: Check the version doesn't go backward
        shell: pwsh
        run: ./.github/scripts/check-version-order.ps1 -Version "${{ steps.version.outputs.version }}" -Commit "${{ steps.src.outputs.sha }}"

      - name: List packages
        shell: pwsh
        run: |
          echo "## Packages to deploy" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path bin -Recurse -Filter "*.nupkg" | ForEach-Object {
            echo "$($_.Name)" >> $env:GITHUB_STEP_SUMMARY
          }
          echo '```' >> $env:GITHUB_STEP_SUMMARY

      # The content template packs (Samples, Starters, AssetPacks) are in this release only when a sample moved to its
      # version (plan-sample-release.ps1). Otherwise the engine names the last published ones, by the exact version in
      # sources/templates/StrideSamplesVersion.props, which this workflow only commits once it is published. Refuse an
      # engine whose content is not on the feed (every New Project would break) or that is stable while naming
      # prerelease content. Samples changed since the published content (its samples/<version> tag) only warn: the
      # engine ships with the published content, which is right for work not released yet.
      - name: Check the content version
        id: samples
        shell: bash
        run: |
          SHA="${{ steps.src.outputs.sha }}"
          VERSION="${{ steps.version.outputs.version }}"
          PACK=$(find bin/packages -maxdepth 1 -name 'Stride.Templates.Samples.*.nupkg' | head -1)
          if [ -n "$PACK" ]; then
            SV=$(basename "$PACK" .nupkg)
            SV=${SV#Stride.Templates.Samples.}
            echo "version=$SV" >> "$GITHUB_OUTPUT"
            echo "::notice::This release includes the samples as $SV"
            case "$VERSION" in
              *-*) ;;
              *) case "$SV" in *-*) echo "::error::Stable engine $VERSION includes prerelease content $SV."; exit 1;; esac;;
            esac
            exit 0
          fi
          FILE=sources/templates/StrideSamplesVersion.props
          SV=$(git show "$SHA:$FILE" | sed -n 's|.*<_StrideCommittedSamplesVersion>\([^<]*\)</.*|\1|p')
          if [ -z "$SV" ]; then
            echo "::error::Could not read the content version from $FILE at $SHA"
            exit 1
          fi
          echo "::notice::Content version named by this engine: $SV"
          case "$VERSION" in
            *-*) ;;
            *) case "$SV" in *-*) echo "::error::Stable engine $VERSION names prerelease content $SV. Run the Upgrade Samples workflow and merge its PR, so the release includes stable samples."; exit 1;; esac;;
          esac
          for id in stride.templates.samples stride.templates.games.starters stride.templates.assetpacks; do
            # Not grep -q: it stops at the match, and under pipefail curl's broken pipe would read as "not published".
            if ! curl -sf "https://api.nuget.org/v3-flatcontainer/$id/index.json" | grep "\"$SV\"" > /dev/null; then
              echo "::error::$id $SV is not on nuget.org, and this release doesn't include the samples."
              exit 1
            fi
          done
          # The commit the published content was packed from (some older content has no such tag).
          if ! git rev-parse -q --verify "refs/tags/samples/$SV" >/dev/null; then
            echo "::warning::No samples/$SV tag; skipped the check for sample changes since the published content."
            exit 0
          fi
          CHANGED=$(git diff --name-only "samples/$SV" "$SHA" -- samples ':(exclude)samples/NewGame' ':(exclude)samples/Library' ':(exclude)*.md')
          if [ -n "$CHANGED" ]; then
            COUNT=$(printf '%s\n' "$CHANGED" | wc -l)
            echo "::warning title=Samples changed::$COUNT sample file(s) changed since the published content $SV (tag samples/$SV). This engine ships with the published $SV content. To ship those changes, move a sample to the version being released (see the run summary)."
            {
              echo "## Sample changes not in the published content ($SV)"
              echo ""
              echo "This engine ships with the published $SV content. Fine for work not released yet; to ship these changes, move a sample to the version being released (the Upgrade Samples workflow, or by hand for one sample) before the release."
              echo ""
              echo '```'
              printf '%s\n' "$CHANGED" | sed -n '1,50p'
              [ "$COUNT" -gt 50 ] && echo "... and $((COUNT - 50)) more"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Again here, for a deploy of a build made earlier: what it depends on may have changed on the feed.
      - name: Check the packages
        shell: pwsh
        run: ./.github/scripts/check-packages.ps1 -Version "${{ steps.version.outputs.version }}"

      # The packages, and the executables in them (build/package/sign-file-list.txt), after every check
      - name: Sign
        run: dotnet build build/package.proj -t:SignPackage --no-restore -p:StrideSign=true
        env:
          StrideSignTenantId: ${{ secrets.STRIDE_SIGN_TENANT_ID }}
          StrideSignClientId: ${{ secrets.STRIDE_SIGN_CLIENT_ID }}
          StrideSignClientSecret: ${{ secrets.STRIDE_SIGN_CLIENT_SECRET }}
          StrideSignKeyVaultCertificate: ${{ secrets.STRIDE_SIGN_KEYVAULT_CERTIFICATE }}
          StrideSignKeyVaultName: ${{ secrets.STRIDE_SIGN_KEYVAULT_NAME }}

      # A short-lived key from nuget.org's trusted publishing policy for this workflow file, instead of a stored one
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.STRIDE_NUGET_USER }}

      - name: Push NuGet packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path bin/packages -Filter "*.nupkg"
          $gameStudio = $packages | Where-Object { $_.Name -match 'GameStudio' }
          $main = $packages | Where-Object { $_.Name -notmatch 'GameStudio' }

          # --skip-duplicate keeps a retry of the same run-id working after a partial deploy. The shell only checks
          # the last command's exit code, so each push is checked here: a real failure stops before GameStudio.
          $skipped = @()
          function Push-Package($pkg) {
            echo "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --api-key $env:STRIDE_NUGET_API_KEY --source "https://api.nuget.org/v3/index.json" --timeout 1800 --skip-duplicate | Tee-Object -Variable out
            if ($LASTEXITCODE -ne 0) {
              echo "::error::Push failed for $($pkg.Name)"
              exit 1
            }
            if ("$out" -match 'already exists') { $script:skipped += $pkg.Name }
          }

          echo "::group::Pushing main packages ($($main.Count))"
          foreach ($pkg in $main) { Push-Package $pkg }
          echo "::endgroup::"

          if ($gameStudio) {
            echo "::group::Pushing GameStudio (last, so dependencies are already available)"
            foreach ($pkg in $gameStudio) { Push-Package $pkg }
            echo "::endgroup::"
          }

          if ($skipped.Count -gt 0) {
            echo "::warning title=Packages already on the feed::$($skipped.Count) of $($packages.Count) package(s) were already on nuget.org and were skipped. Normal for a retry of the same run-id. If this is a different build, the feed now has mixed packages."
          }
        env:
          STRIDE_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Tag release
        id: tag
        run: |
          TAG="releases/${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG" "${{ steps.src.outputs.sha }}"   # tag the commit the artifacts were built from
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
        run: |
          SHA="${{ steps.src.outputs.sha }}"
          VERSION="${{ steps.version.outputs.version }}"
          # A retry of a deploy that failed in a later step.
          if gh release view "releases/$VERSION" >/dev/null 2>&1; then
            echo "Release releases/$VERSION already exists, skipping"
            exit 0
          fi
          # Base the changelog on the previous engine release, not the chronologically previous
          # tag (which could be a cli/* release and would interleave the two products' changelogs).
          PREV=$(git describe --tags --abbrev=0 --match 'releases/*' "$SHA^" 2>/dev/null || true)
          START_TAG_ARG=()
          if [ -n "$PREV" ]; then
            START_TAG_ARG=(--notes-start-tag "$PREV")
          fi
          # A suffixed version (e.g. 4.4.0-beta1) is a prerelease, so it must not become the
          # repository's "Latest" release. Stable versions stay eligible for the Latest label.
          PRERELEASE_ARG=()
          case "$VERSION" in *-*) PRERELEASE_ARG=(--prerelease);; esac
          # The content packs go on the samples release below.
          ASSETS=()
          for PKG in bin/packages/*.nupkg; do
            case "$(basename "$PKG")" in
              Stride.Templates.Samples.*|Stride.Templates.Games.Starters.*|Stride.Templates.AssetPacks.*) ;;
              *) ASSETS+=("$PKG");;
            esac
          done
          # No --target: the tag step above already pushed the tag. With a target, GitHub refuses a token without
          # the workflow permission when the workflow files differ between that commit and the default branch.
          gh release create "releases/$VERSION" \
            --title "Stride $VERSION" \
            --verify-tag \
            --generate-notes "${START_TAG_ARG[@]}" "${PRERELEASE_ARG[@]}" \
            "${ASSETS[@]}"

      - name: Tag and release the samples
        if: ${{ steps.samples.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
        run: |
          V="${{ steps.samples.outputs.version }}"
          TAG="samples/$V"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "${{ steps.src.outputs.sha }}"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          # The changelog is the sample commits since the previous samples/* tag, so engine commits don't leak into it.
          PREV=$(git describe --tags --abbrev=0 --match 'samples/*' "$TAG^" 2>/dev/null || true)
          RANGE="$TAG"
          [ -n "$PREV" ] && RANGE="$PREV..$TAG"
          NOTES=$(git log --no-merges --pretty='- %s (%h)' "$RANGE" -- samples ':(exclude)samples/NewGame' ':(exclude)samples/Library')
          [ -z "$NOTES" ] && NOTES="_No sample changes since the previous samples release._"
          {
            echo "## What's changed in the Stride samples"
            echo ""
            echo "$NOTES"
            if [ -n "$PREV" ]; then
              echo ""
              echo "**Full samples changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$PREV...$TAG"
            fi
          } > samples-notes.md
          PRERELEASE_ARG=()
          case "$V" in *-*) PRERELEASE_ARG=(--prerelease);; esac
          gh release create "$TAG" \
            --title "Stride samples $V" \
            --notes-file samples-notes.md \
            --verify-tag \
            --latest=false \
            "${PRERELEASE_ARG[@]}" \
            bin/packages/Stride.Templates.Samples.*.nupkg bin/packages/Stride.Templates.Games.Starters.*.nupkg bin/packages/Stride.Templates.AssetPacks.*.nupkg

      # Once the content is on the feed, the branch names it, so engines built from here on use it.
      - name: Commit the content version
        if: ${{ steps.samples.outputs.version != '' }}
        run: |
          V="${{ steps.samples.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          FILE=sources/templates/StrideSamplesVersion.props
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
            sed -i "s|<_StrideCommittedSamplesVersion>[^<]*</|<_StrideCommittedSamplesVersion>$V</|" "$FILE"
            if ! grep -q "<_StrideCommittedSamplesVersion>$V</_StrideCommittedSamplesVersion>" "$FILE"; then
              echo "::error::Could not set the content version $V in $FILE. The samples are published; set it by hand."
              exit 1
            fi
            if git diff --quiet -- "$FILE"; then
              echo "The content version is already $V, nothing to commit"
              exit 0
            fi
            # Commit only the version file (never -a), so an unexpected working-tree change can't ride along.
            git commit -m "Samples: content version $V (released samples/$V)" -- "$FILE"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push refused (attempt $ATTEMPT), trying again from the new branch tip"
            sleep $((ATTEMPT * 10))
          done
          echo "::error::Could not push the content version $V to $BRANCH. The samples are published; commit it by hand."
          exit 1

      - name: Bump version for next cycle
        # After every deploy, beta or stable, advance Patch on the branch, so the committed number has never been released
        # (the tag above points at the just-released commit). The number is read from the branch tip after a fetch, not
        # from the built commit: nothing is bumped when the tip already moved past the release, by an upgrader PR or a
        # re-run of this deploy. A push refused because the branch just moved starts again from the new tip.
        run: |
          RELEASED="${{ steps.version.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          FILE=sources/shared/SharedAssemblyInfo.cs
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
            LINE=$(sed -n 's/.*public const string MajorMinor = "\([0-9.]*\)".*/\1/p' "$FILE")
            CUR=$(sed -n 's/.*public const string Patch = "\([0-9][0-9]*\)".*/\1/p' "$FILE")
            # Don't commit anything if the version can't be parsed (e.g. the file's shape changed). The release already
            # succeeded; warn and skip - the forget-to-bump guard will catch the un-bumped version next release.
            if ! printf '%s' "$CUR" | grep -qE '^[0-9]+$' || [ -z "$LINE" ]; then
              echo "::warning::Could not parse the version from $FILE (got '$LINE.$CUR'); skipping version bump - bump it manually."
              exit 0
            fi
            if [ "$LINE.$CUR" != "${RELEASED%%-*}" ]; then
              echo "::notice::$BRANCH is at $LINE.$CUR, not the released $RELEASED: nothing to bump."
              exit 0
            fi
            NEXT=$((CUR + 1))
            sed -i "s/\(public const string Patch = \)\"$CUR\"/\1\"$NEXT\"/" "$FILE"
            if ! grep -q "public const string Patch = \"$NEXT\";" "$FILE"; then
              echo "::warning::Version bump did not apply to $FILE; skipping - bump it manually."
              exit 0
            fi
            # Commit only the version file (never -a), so an unexpected working-tree change can't ride along.
            git commit -m "Open $LINE.$NEXT for development (released $RELEASED)" -- "$FILE"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push refused (attempt $ATTEMPT), trying again from the new branch tip"
            sleep $((ATTEMPT * 10))
          done
          echo "::warning::Could not push the version bump to $BRANCH; bump Patch manually."

      - name: Publish summary
        if: success()
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $v = $env:VERSION
          echo "## Published $v" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "[GitHub Release]($env:REPO_URL/releases/tag/releases/$v)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Package | nuget.org |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path bin/packages -Filter "*.nupkg" | Sort-Object Name | ForEach-Object {
            $id = $_.Name -replace "\.$([regex]::Escape($v))\.nupkg$", ''
            echo "| $id | https://www.nuget.org/packages/$id/$v |" >> $env:GITHUB_STEP_SUMMARY
          }

  #
  # Generate and apply the AI release notes. A separate job so the 5-15 min generation runs
  # off the Deploy critical path: the release (packages + GitHub release with the default
  # --generate-notes body) is already live when Deploy finishes; this replaces the body with
  # the bullet list a few minutes later. No 'production' environment, so it needs no second
  # approval. Runs for both a direct release-deploy dispatch and release.yml's Deploy stage.
  #
  ReleaseNotes:
    name: Release notes ${{ needs.Deploy.outputs.version }}
    needs: Deploy
    if: ${{ needs.Deploy.outputs.version != '' }}
    permissions:
      contents: read       # passed down only as the model's read-only token; apply uses the Stride Bot token
      pull-requests: read  # lets the model trace commits to their PRs
    uses: ./.github/workflows/release-notes-apply.yml
    with:
      tag: releases/${{ needs.Deploy.outputs.version }}
      tag-match: 'releases/*'
      product: the Stride engine
      # Whole repo except the separately-released products.
      scope: >-
        . :(exclude)sources/launcher/Stride.Cli
        :(exclude)sources/tools/Stride.VisualStudio.*
        :(exclude)sources/launcher/Stride.Launcher
      apply: true
      add-contributors: true    # engine release only: New Contributors is repo-wide
      docs-notes: true          # engine release only: stride-docs has the engine's release notes
    secrets:
      bot-private-key: ${{ secrets.STRIDE_BOT_PRIVATE_KEY }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY_RELEASE_NOTES }}
