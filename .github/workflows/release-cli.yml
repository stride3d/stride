name: Release CLI

# Builds and (optionally) signs and deploys the Stride CLI dotnet tool (Stride.Cli) to NuGet.org.
#
# Versioned independently of the engine: the SemVer in sources/launcher/Stride.Cli/Stride.Cli.csproj
# is the source of truth - bump <Version> by hand before a stable release. A deploy pushes to
# NuGet.org, tags cli/<version> at the built commit, and creates a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to NuGet.org and create a GitHub Release
        default: false
        type: boolean
      version-suffix:
        description: Prerelease suffix, no leading dash (e.g. "beta1" -> 1.0.0-beta1). Empty = stable.
        default: ''
        type: string

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Validate:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can't read team membership: the Stride Bot app can (Organization Members: Read).
      - name: Get the Stride Bot token
        id: bot
        if: ${{ inputs.deploy }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STRIDE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.STRIDE_BOT_PRIVATE_KEY }}
          permission-members: read

      - name: Check release permissions
        if: ${{ inputs.deploy }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          ORG=$(echo "${{ github.repository }}" | cut -d/ -f1)
          TEAM="stride-release-managers"
          USER="${{ github.actor }}"
          if ! gh api "orgs/$ORG/teams/$TEAM/memberships/$USER" --silent 2>/dev/null; then
            echo "::error::User $USER is not a member of $ORG/$TEAM. Deploy requires stride-release-managers team membership."
            exit 1
          fi

  Package:
    name: Package
    needs: Validate
    runs-on: windows-2025-vs2026
    # No environment and no secrets: the package is signed by the Deploy job, in production.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0  # full history + tags for the re-publish guard
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build package
        run: |
          # --no-restore: the target restores what it needs; the implicit restore would restore all of Stride.slnx
          dotnet build build\package.proj `
            -t:BuildPackageCli `
            --no-restore `
            -p:VersionSuffix=${{ inputs.version-suffix }}

      - name: Detect version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path bin/cli -Filter "Stride.Cli.*.nupkg" | Select-Object -First 1
          if (-not $pkg) {
            echo "::error::No Stride.Cli package found"
            exit 1
          }
          $version = $pkg.Name -replace 'Stride\.Cli\.(.*?)\.nupkg','$1'
          if ($version -notmatch '^\d+\.\d+\.\d+(-(alpha|beta|rc|preview)\d+)?$') {
            echo "::error::Version '$version' is not an allowed release version. Use X.Y.Z or X.Y.Z-(alpha|beta|rc|preview)<N> (e.g. 1.0.0, 1.0.0-beta1) - check Stride.Cli.csproj"
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "::notice::CLI package version: $version"

      # Forget-to-bump guard: <Version> is committed and bumped per release. If it wasn't bumped, its
      # cli/<version> tag already exists on a previously-released commit, so fail rather than re-publish.
      - name: Guard against re-publishing an existing version
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          TAG="cli/${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1 && [ -z "$(git tag --points-at HEAD --list "$TAG")" ]; then
            echo "::error::CLI version ${{ steps.version.outputs.version }} is already released (tag $TAG on another commit). Bump <Version> in Stride.Cli.csproj."
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: stride-cli-${{ steps.version.outputs.version }}
          path: bin/cli/*.nupkg
          if-no-files-found: error

  # Surface the version in the run UI even when Deploy is skipped.
  Version:
    name: Packaged CLI ${{ needs.Package.outputs.version }}
    needs: Package
    if: ${{ always() && needs.Package.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice title=Packaged CLI::${{ needs.Package.outputs.version }}"

  Deploy:
    name: Deploy ${{ needs.Package.outputs.version }}
    if: ${{ inputs.deploy }}
    needs: Package
    runs-on: windows-2025  # the sign tool needs Windows
    environment: production  # requires manual approval in GitHub settings
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: 1  # Git Bash: keep tag and path arguments as they are
    permissions:
      contents: write
      id-token: write # nuget.org trusted publishing
    steps:
      # The Stride Release app's key is only in the production environment, and the app may pass the master ruleset.
      - name: Get the Stride Release token
        id: release
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STRIDE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.STRIDE_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-members: read

      - name: Check release permissions
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
        run: |
          ORG=$(echo "${{ github.repository }}" | cut -d/ -f1)
          TEAM="stride-release-managers"
          USER="${{ github.actor }}"
          if ! gh api "orgs/$ORG/teams/$TEAM/memberships/$USER" --silent 2>/dev/null; then
            echo "::error::User $USER is not a member of $ORG/$TEAM. Deploy requires stride-release-managers team membership."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.release.outputs.token }}  # push the cli/<version> tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: stride-cli-${{ needs.Package.outputs.version }}
          path: bin/cli

      - name: Sign
        run: dotnet build build/package.proj -t:SignPackageCli --no-restore -p:StrideSign=true
        env:
          StrideSignTenantId: ${{ secrets.STRIDE_SIGN_TENANT_ID }}
          StrideSignClientId: ${{ secrets.STRIDE_SIGN_CLIENT_ID }}
          StrideSignClientSecret: ${{ secrets.STRIDE_SIGN_CLIENT_SECRET }}
          StrideSignKeyVaultCertificate: ${{ secrets.STRIDE_SIGN_KEYVAULT_CERTIFICATE }}
          StrideSignKeyVaultName: ${{ secrets.STRIDE_SIGN_KEYVAULT_NAME }}

      # A short-lived key from nuget.org's trusted publishing policy for this workflow file, instead of a stored one
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.STRIDE_NUGET_USER }}

      - name: Push to NuGet.org
        shell: bash
        run: |
          for pkg in bin/cli/*.nupkg; do
            echo "Pushing $(basename "$pkg")..."
            dotnet nuget push "$pkg" --api-key "$STRIDE_NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --timeout 1800 --skip-duplicate
          done
        env:
          STRIDE_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Tag release
        run: |
          TAG="cli/${{ needs.Package.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
        run: |
          TAG="cli/${{ needs.Package.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            # The CLI is a separate product from the engine. Build its changelog from the previous
            # cli/* tag and scope it to the CLI sources, so engine commits don't leak into it (and
            # so the two products' changelogs don't interleave, as GitHub's auto notes would do).
            PREV=$(git describe --tags --abbrev=0 --match 'cli/*' "$TAG^" 2>/dev/null || true)
            RANGE="$TAG"
            [ -n "$PREV" ] && RANGE="$PREV..$TAG"
            NOTES=$(git log --no-merges --pretty='- %s (%h)' "$RANGE" -- sources/launcher/Stride.Cli)
            [ -z "$NOTES" ] && NOTES="_No CLI-specific changes since the previous release._"
            {
              echo "## What's changed in the Stride CLI"
              echo ""
              echo "$NOTES"
              if [ -n "$PREV" ]; then
                echo ""
                echo "**Full CLI changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$PREV...$TAG"
              fi
            } > cli-notes.md
            gh release create "$TAG" \
              --title "Stride CLI ${{ needs.Package.outputs.version }}" \
              --notes-file cli-notes.md \
              --latest=false \
              bin/cli/*.nupkg
          fi

      - name: Publish summary
        if: success()
        shell: bash
        run: |
          V="${{ needs.Package.outputs.version }}"
          {
            echo "## Published Stride.Cli $V"
            echo ""
            echo "- [nuget.org](https://www.nuget.org/packages/Stride.Cli/$V)"
            echo "- [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/cli/$V)"
            echo ""
            echo "Install: \`dotnet tool install -g Stride.Cli --version $V\`"
          } >> "$GITHUB_STEP_SUMMARY"

  #
  # AI release notes, off the Deploy critical path (see release-notes-apply.yml). Runs after
  # the release exists; replaces the scoped git-log body with the AI bullet list.
  #
  ReleaseNotes:
    name: Release notes cli/${{ needs.Package.outputs.version }}
    needs: [Package, Deploy]
    if: ${{ needs.Package.outputs.version != '' }}
    permissions:
      contents: read       # passed down only as the model's read-only token; apply uses the Stride Bot token
      pull-requests: read  # lets the model trace commits to their PRs
    uses: ./.github/workflows/release-notes-apply.yml
    with:
      tag: cli/${{ needs.Package.outputs.version }}
      tag-match: 'cli/*'
      product: the Stride CLI
      scope: sources/launcher/Stride.Cli
      apply: true
    secrets:
      bot-private-key: ${{ secrets.STRIDE_BOT_PRIVATE_KEY }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY_RELEASE_NOTES }}
