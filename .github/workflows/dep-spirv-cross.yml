name: "Dep: Build & Deploy SPIRV-Cross"

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version (leave empty for the SPIRV-Cross version and the next build number)
        required: false
      ref:
        description: stride3d/SPIRV-Cross ref to build (branch, tag or SHA)
        required: true

# Debug files: the builds compile with debug info, and the .pdb goes to the symbols pre-release (dep-symbols.yml).
# CFLAGS, CXXFLAGS and LDFLAGS add to CMake's default flags: /Z7 doesn't change the generated code, and /DEBUG needs
# /OPT:REF and /OPT:ICF to link as a Release build does.

env:
  SPIRV_CROSS_REF: ${{ github.event.inputs.ref }}

jobs:
  # The builds check out this one commit, so every RID gets the same sources even when a branch moves during the run.
  resolve:
    name: Resolve SPIRV-Cross ref and version
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      number: ${{ steps.version.outputs.number }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Resolve ref to a commit
        id: resolve
        run: |
          git init -q spirv-cross-src
          git -C spirv-cross-src remote add origin https://github.com/stride3d/SPIRV-Cross.git
          git -C spirv-cross-src fetch -q --depth 1 --filter=tree:0 origin "$SPIRV_CROSS_REF"
          echo "commit=$(git -C spirv-cross-src rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      # SPIRV-Cross has no release versions, only Vulkan SDK tags: its version is the ABI version of its C API
      - name: Package version
        id: version
        shell: pwsh
        run: |
          $commit = '${{ steps.resolve.outputs.commit }}'
          $cmake = (git -C spirv-cross-src show "${commit}:CMakeLists.txt") -join "`n"
          $found = [regex]::Matches($cmake, '(?m)^set\(spirv-cross-abi-major (\d+)\)\nset\(spirv-cross-abi-minor (\d+)\)\nset\(spirv-cross-abi-patch (\d+)\)$')
          if ($found.Count -ne 1) { throw "CMakeLists.txt doesn't set spirv-cross-abi-major, -minor and -patch once, on three lines in a row" }
          $groups = $found[0].Groups
          stride-src/.github/scripts/dep-version.ps1 -Name spirv-cross -PackageId Stride.Dependencies.SpirvCross -Official "$($groups[1]).$($groups[2]).$($groups[3])" `
            -Source spirv-cross-src -Commit $commit -Upstream https://github.com/KhronosGroup/SPIRV-Cross.git `
            -Override '${{ github.event.inputs.version }}'

  build-windows:
    name: Build SPIRV-Cross (Windows x64)
    needs: resolve
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout SPIRV-Cross
        uses: actions/checkout@v7
        with:
          repository: stride3d/SPIRV-Cross
          ref: ${{ needs.resolve.outputs.commit }}
          path: spirv-cross-src

      - name: Build
        shell: pwsh
        env: { CFLAGS: /Z7, CXXFLAGS: /Z7, LDFLAGS: /DEBUG /OPT:REF /OPT:ICF }
        run: |
          cmake -S spirv-cross-src -B spirv-cross-build -Thost=x64 `
            -DSPIRV_CROSS_SHARED=ON `
            -DSPIRV_CROSS_CLI=OFF `
            -DSPIRV_CROSS_ENABLE_TESTS=OFF
          cmake --build spirv-cross-build --config Release --target spirv-cross-c-shared

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: spirv-cross-win-x64
          path: spirv-cross-build/Release/spirv-cross-c-shared.dll

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-spirv-cross-win-x64
          path: spirv-cross-build/Release/spirv-cross-c-shared.pdb

  # Windows ARM64 — same host, MSVC ARM64 cross-compile (as in dep-spirv-tools.yml).
  build-windows-arm64:
    name: Build SPIRV-Cross (Windows ARM64)
    needs: resolve
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout SPIRV-Cross
        uses: actions/checkout@v7
        with:
          repository: stride3d/SPIRV-Cross
          ref: ${{ needs.resolve.outputs.commit }}
          path: spirv-cross-src

      - name: Build
        shell: pwsh
        env: { CFLAGS: /Z7, CXXFLAGS: /Z7, LDFLAGS: /DEBUG /OPT:REF /OPT:ICF }
        run: |
          cmake -S spirv-cross-src -B spirv-cross-build -A ARM64 -Thost=x64 `
            -DSPIRV_CROSS_SHARED=ON `
            -DSPIRV_CROSS_CLI=OFF `
            -DSPIRV_CROSS_ENABLE_TESTS=OFF
          cmake --build spirv-cross-build --config Release --target spirv-cross-c-shared

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: spirv-cross-win-arm64
          path: spirv-cross-build/Release/spirv-cross-c-shared.dll

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-spirv-cross-win-arm64
          path: spirv-cross-build/Release/spirv-cross-c-shared.pdb

  pack:
    name: Pack NuGet ${{ needs.resolve.outputs.number }}
    needs: [resolve, build-windows, build-windows-arm64]
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: spirv-cross-win-x64
          path: artifacts/win-x64

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: spirv-cross-win-arm64
          path: artifacts/win-arm64

      - name: Prepare package contents
        shell: pwsh
        run: |
          $destDir = "deps/spirv-cross"
          # Silk.NET expects the DLL named "spirv-cross"
          foreach ($rid in 'win-x64', 'win-arm64') {
            New-Item -Path "$destDir/$rid" -ItemType Directory -Force | Out-Null
            Copy-Item "artifacts/$rid/spirv-cross-c-shared.dll" "$destDir/$rid/spirv-cross.dll"
          }

      - name: Write VERSION.txt and README.md
        shell: pwsh
        run: |
          $lines = @(
            "SPIRV-Cross $env:SPIRV_CROSS_REF"
            "Version: ${{ needs.resolve.outputs.version }}"
            "Repository: https://github.com/stride3d/SPIRV-Cross"
            "Commit: ${{ needs.resolve.outputs.commit }}"
            "${{ needs.resolve.outputs.source }}"
            ""
            "Stride: ${{ github.server_url }}/${{ github.repository }} @ ${{ github.sha }}"
            "Built: $(Get-Date -AsUTC -Format yyyy-MM-dd)"
            "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          # The symbols job creates this pre-release on stride3d/stride only
          if ('${{ github.repository }}' -eq 'stride3d/stride') {
            $lines += "Debug files: ${{ github.server_url }}/${{ github.repository }}/releases/tag/deps/spirv-cross/${{ needs.resolve.outputs.number }}"
          }
          New-Item -ItemType Directory -Force deps/spirv-cross/tools | Out-Null
          $lines | Set-Content deps/spirv-cross/tools/VERSION.txt
          $block = @('```') + $lines + @('```')
          $block | Add-Content $env:GITHUB_STEP_SUMMARY
          @(
            "# Stride.Dependencies.SpirvCross"
            ""
            "SPIRV-Cross shared library for Stride SPIR-V to HLSL/GLSL translation."
            ""
            "## Build"
            ""
          ) + $block | Set-Content deps/spirv-cross/README.md

      - name: Pack NuGet
        shell: pwsh
        run: |
          $commitHash = '${{ needs.resolve.outputs.commit }}'.Substring(0, 7)
          nuget pack deps/spirv-cross/Stride.Dependencies.SpirvCross.nuspec `
            -Version "${{ needs.resolve.outputs.version }}" `
            -Properties "commit=$commitHash;strideCommit=${{ github.sha }}" `
            -OutputDirectory nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Stride.Dependencies.SpirvCross.nupkg
          path: nupkg/*.nupkg

      - uses: actions/upload-artifact@v7
        with: { name: version-spirv-cross, path: deps/spirv-cross/tools/VERSION.txt }

  # Signing and pushing are shared by all dependencies: nuget.org trusts dep-publish.yml
  publish:
    name: Publish ${{ needs.resolve.outputs.number }}
    needs: [resolve, pack]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/dep-publish.yml
    secrets: inherit # without it, the called job gets no secret, not even those of its environment
    with:
      artifact: Stride.Dependencies.SpirvCross.nupkg

  # After publish: a package that was not published gets no debug files
  symbols:
    needs: [resolve, pack, publish]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dep-symbols.yml
    with:
      name: spirv-cross
      version: ${{ needs.resolve.outputs.number }}
      notes-artifact: version-spirv-cross
