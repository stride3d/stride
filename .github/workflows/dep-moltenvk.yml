name: "Dep: Build MoltenVK"

# Vendors MoltenVK binaries for Stride. Clones KhronosGroup/MoltenVK at the
# requested git ref (tag / branch / commit), runs fetchDependencies, and
# builds the macOS dylib + iOS + iOS-simulator static libs.
#
# Output per RID:
#   osx-arm64           libvulkan.1.dylib  (dynamic dylib, renamed +
#                                           signed so dyld matches
#                                           the leaf name Vortice.Vulkan
#                                           dlopen()s)
#   ios-arm64           libMoltenVK.a      (device static, statically linked
#                                           into the .app, accessed via
#                                           [DllImport("__Internal")])
#   iossimulator-arm64  libMoltenVK.a      (Apple Silicon simulator static)
#
# RIDs covered: osx-arm64, ios-arm64, iossimulator-arm64. dep-moltenvk.xcconfig builds arm64 only.
#
# Debug files: dep-debug-info.xcconfig (in dep-moltenvk.xcconfig) turns on debug info for the Xcode builds, which
# MoltenVK's Release turns off. The iOS static libraries are relinked to keep it.
# The libraries ship without it (dep-split-debug.sh), and the debug files go to the symbols pre-release
# (dep-symbols.yml).

on:
  workflow_dispatch:
    inputs:
      moltenvk-version:
        description: MoltenVK git ref to build (tag like v1.4.2, branch like main, or a commit SHA)
        default: v1.4.2
        required: true

jobs:
  vendor:
    name: Build & repackage MoltenVK
    runs-on: macos-15
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Build MoltenVK from source
        env: { XCODE_XCCONFIG_FILE: '${{ github.workspace }}/stride-src/.github/scripts/dep-moltenvk.xcconfig' }
        run: |
          # Shallow init + fetch supports both refnames (tags/branches) and raw
          # SHAs uniformly, unlike `git clone --branch`.
          mkdir -p mvk-src && cd mvk-src
          git init -q
          git remote add origin https://github.com/KhronosGroup/MoltenVK.git
          git fetch --depth 1 origin "${{ github.event.inputs.moltenvk-version }}"
          git checkout -q FETCH_HEAD
          # SPIRV-Cross / SPIRV-Tools / etc. — must be built per-platform.
          ./fetchDependencies --macos --ios --iossim
          # Release config for parity with upstream release artifacts.
          make macos
          make ios
          make iossim
          BUILT_SHA=$(git rev-parse --short HEAD)
          echo "MVK_BUILD_LABEL=${{ github.event.inputs.moltenvk-version }}@${BUILT_SHA}" >> $GITHUB_ENV

      - name: Relink iOS static libraries with their debug info
        run: |
          # MoltenVK's static targets link their objects and libMoltenVKShaderConverter.a into one master object
          # (ld -r), which keeps no DWARF: it writes a debug map that points at the .o files of DerivedData, lost once
          # the archive leaves the runner. An archive of the objects its debug map names keeps each one with its DWARF:
          # MoltenVK's objects, and the members of libMoltenVKShaderConverter.a (SPIRV-Cross, SPIRV-Tools) that ld -r
          # took, which it names as <archive>(<member>).
          build=(~/Library/Developer/Xcode/DerivedData/MoltenVKPackaging-*/Build)
          [ ${#build[@]} -eq 1 ] || { echo "::error::not one MoltenVKPackaging DerivedData: ${build[*]}"; exit 1; }
          for p in iphoneos:ios-arm64 iphonesimulator:iossimulator-arm64; do
            sdk=${p%%:*} rid=${p#*:}
            master=$build/Intermediates.noindex/MoltenVK.build/Release-$sdk/MoltenVK-iOS-static.build/Objects-normal/libMoltenVK.a-arm64-master.o
            members=relinked/$rid/members
            mkdir -p $members
            inputs=()
            while IFS= read -r object; do
              case "$object" in
                *\))
                  archive=${object%%(*} member=${object#*(} member=${member%)}
                  # ar x takes a member by its name
                  [ -z "$(ar t "$archive" | sort | uniq -d)" ] || { echo "::error::$archive has two members of one name"; exit 1; }
                  (cd $members && ar x "$archive" "$member")
                  inputs+=("$members/$member")
                  ;;
                *) inputs+=("$object") ;;
              esac
            done < <(nm -ap "$master" | sed -n 's/.* OSO //p')
            echo "$rid: ${#inputs[@]} objects in the debug map of $(basename "$master")"
            xcrun libtool -static -arch_only arm64 -D -o relinked/$rid/libMoltenVK.a "${inputs[@]}"
          done

      - name: Repackage macOS dylib (osx-arm64)
        run: |
          # Rename to the Vulkan loader leaf name so Vortice.Vulkan's
          # dlopen("libvulkan.1.dylib") matches.
          cp mvk-src/Package/Release/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib libvulkan.1.dylib
          # Rewrite LC_ID_DYLIB so dyld's already-loaded match keys on the new
          # leaf name rather than the original "@rpath/libMoltenVK.dylib".
          install_name_tool -id libvulkan.1.dylib libvulkan.1.dylib
          # Strips it, and signs it again, which install_name_tool requires too
          stride-src/.github/scripts/dep-split-debug.sh libvulkan.1.dylib out/dotnet/osx-arm64 symbols/osx-arm64

      - name: Repackage iOS device static (ios-arm64)
        run: |
          stride-src/.github/scripts/dep-split-debug.sh relinked/ios-arm64/libMoltenVK.a out/dotnet/ios-arm64 symbols/ios-arm64

      - name: Repackage iOS simulator static (iossimulator-arm64)
        run: |
          stride-src/.github/scripts/dep-split-debug.sh \
            relinked/iossimulator-arm64/libMoltenVK.a out/dotnet/iossimulator-arm64 symbols/iossimulator-arm64

      - name: Version
        id: version
        shell: pwsh
        run: |
          $header = (Get-Content mvk-src/MoltenVK/MoltenVK/API/mvk_private_api.h) -join "`n"
          $parts = foreach ($part in 'MAJOR', 'MINOR', 'PATCH') {
            $found = [regex]::Matches($header, "(?m)^#define MVK_VERSION_$part\s+(\d+)\s*$")
            if ($found.Count -ne 1) { throw "MoltenVK/MoltenVK/API/mvk_private_api.h doesn't define MVK_VERSION_$part once" }
            $found[0].Groups[1].Value
          }
          stride-src/.github/scripts/dep-version.ps1 -Name moltenvk -Official ($parts -join '.') `
            -Source mvk-src -Commit HEAD -Upstream https://github.com/KhronosGroup/MoltenVK.git -TagPrefix v

      - name: Write VERSION.txt
        run: |
          {
            printf 'MoltenVK %s\n' "$MVK_BUILD_LABEL"
            printf 'Version: %s\n' "${{ steps.version.outputs.version }}"
            printf 'Repository: https://github.com/KhronosGroup/MoltenVK\n'
            printf 'Source: built from git ref "%s" on the macos-15 runner\n' \
              "${{ github.event.inputs.moltenvk-version }}"
            printf '\n'
            printf 'Stride: %s/%s @ %s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.sha }}"
            printf 'Built: %s\n' "$(date -u +%Y-%m-%d)"
            printf 'Workflow: %s/%s/actions/runs/%s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}"
            printf 'Debug files: %s/%s/releases/tag/deps/moltenvk/%s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ steps.version.outputs.number }}"
          } > out/VERSION.txt

      - name: List contents
        run: find out symbols -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: moltenvk-all-platforms
          path: out/

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-moltenvk-osx-arm64
          path: symbols/osx-arm64/

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-moltenvk-ios-arm64
          path: symbols/ios-arm64/

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-moltenvk-iossimulator-arm64
          path: symbols/iossimulator-arm64/

  symbols:
    needs: vendor
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dep-symbols.yml
    with:
      name: moltenvk
      version: ${{ needs.vendor.outputs.number }}
      notes-artifact: moltenvk-all-platforms
