name: "Dep: Build spirv_to_dxil (Mesa)"

# Debug files: as in dep-freetype.yml, the build compiles with debug info (/Z7 and /DEBUG next to meson's release
# flags), the DLL ships without its .pdb, and the .pdb goes to the symbols pre-release (dep-symbols.yml).

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Mesa git URL
        default: https://gitlab.freedesktop.org/mesa/mesa.git
        required: false
      ref:
        description: Mesa ref to build (branch, tag, SHA, or refs/merge-requests/<id>/head); the default is the commit Stride ships
        default: 50ab52f135e42f6f52ccbfadf78b00eab0a2b3b6
        required: false

jobs:
  build-windows:
    name: Build spirv_to_dxil (Windows x64)
    runs-on: windows-2025-vs2026
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - name: Checkout Stride (for patch file)
        uses: actions/checkout@v7
        with:
          path: stride-src
          sparse-checkout: |
            deps/spirv-to-dxil
            .github/scripts

      - name: Clone Mesa
        shell: pwsh
        run: |
          $url = "${{ github.event.inputs.repository || 'https://gitlab.freedesktop.org/mesa/mesa.git' }}"
          $ref = "${{ github.event.inputs.ref || '50ab52f135e42f6f52ccbfadf78b00eab0a2b3b6' }}"
          git init mesa-src
          # Keep LF line endings — our patch is LF, and on Windows runners
          # autocrlf=true would otherwise add CR which breaks `git apply`.
          git -C mesa-src config core.autocrlf false
          git -C mesa-src config core.eol lf
          git -C mesa-src remote add origin $url
          git -C mesa-src fetch --depth 1 origin $ref
          git -C mesa-src checkout FETCH_HEAD

      # Mesa's meson.build reads its version from the VERSION file. The patches make it a build of ours: the metadata
      # of the version counts them.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $file = @(Get-Content mesa-src/VERSION)
          if ($file.Count -ne 1 -or $file[0] -notmatch '^\d+\.\d+\.\d+(-devel|-rc\d+)?$') { throw "VERSION isn't one line 'N.N.N[-devel|-rcN]': '$file'" }
          $patches = @(Get-ChildItem stride-src/deps/spirv-to-dxil/*.patch).Count
          stride-src/.github/scripts/dep-version.ps1 -Name spirv-to-dxil -Official $file[0] `
            -Source mesa-src -Commit HEAD -Upstream https://gitlab.freedesktop.org/mesa/mesa.git `
            -TagPrefix mesa- -Marker "patches-$patches"

      - name: Apply Stride pipeline patch
        shell: pwsh
        working-directory: mesa-src
        run: |
          git apply --3way --verbose "${{ github.workspace }}/stride-src/deps/spirv-to-dxil/mesa-pipeline.patch"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Mesa
        shell: cmd
        working-directory: mesa-src
        run: |
          set PYTHONUTF8=1
          meson setup _build ^
            --default-library=shared ^
            --buildtype=release ^
            --wrap-mode=default ^
            -Dc_args="/wd4189 /Z7" ^
            -Dcpp_args="/wd4189 /Z7" ^
            -Dc_link_args="/DEBUG /OPT:REF /OPT:ICF" ^
            -Dcpp_link_args="/DEBUG /OPT:REF /OPT:ICF" ^
            -Dshared-glapi=disabled ^
            -Dgles1=disabled ^
            -Dgles2=disabled ^
            -Dopengl=false ^
            -Degl=disabled ^
            -Dglx=disabled ^
            -Dvulkan-drivers= ^
            -Dgallium-drivers= ^
            -Dplatforms= ^
            -Dmicrosoft-clc=disabled ^
            -Dspirv-to-dxil=true ^
            -Dstride-mimalloc=true ^
            -Dbuild-tests=false ^
            -Dllvm=disabled

      - name: Build
        shell: cmd
        working-directory: mesa-src
        run: |
          set PYTHONUTF8=1
          meson compile -C _build src/microsoft/spirv_to_dxil/spirv_to_dxil:shared_library

      # No UPX: packed, the DLL with mimalloc fails to load (ERROR_DLL_INIT_FAILED)
      - name: Collect DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out, symbols | Out-Null
          $dll = Get-ChildItem -Recurse mesa-src/_build -Filter spirv_to_dxil.dll | Select-Object -First 1
          Copy-Item $dll.FullName out/spirv_to_dxil.dll
          Copy-Item ($dll.FullName -replace '\.dll$', '.pdb') symbols/
          # Record commits for traceability
          $mesaCommit = git -C mesa-src rev-parse HEAD
          $mesaUrl = git -C mesa-src config --get remote.origin.url
          $lines = @(
            "Version: ${{ steps.version.outputs.version }}"
            "Mesa: $mesaUrl @ $mesaCommit"
          )
          if ('${{ steps.version.outputs.source }}') { $lines += '${{ steps.version.outputs.source }}' }
          $lines += "Stride: ${{ github.server_url }}/${{ github.repository }} @ ${{ github.sha }} (for workflow and deps/spirv-to-dxil/mesa-pipeline.patch)"
          # The symbols job creates this pre-release on stride3d/stride only
          if ('${{ github.repository }}' -eq 'stride3d/stride') {
            $lines += "Debug files: ${{ github.server_url }}/${{ github.repository }}/releases/tag/deps/spirv-to-dxil/${{ steps.version.outputs.number }}"
          }
          $lines | Out-File out/VERSION.txt
          Get-ChildItem out, symbols

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spirv_to_dxil-win-x64
          path: out/

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-spirv-to-dxil-win-x64
          path: symbols/

  symbols:
    needs: build-windows
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dep-symbols.yml
    with:
      name: spirv-to-dxil
      version: ${{ needs.build-windows.outputs.number }}
      notes-artifact: spirv_to_dxil-win-x64
