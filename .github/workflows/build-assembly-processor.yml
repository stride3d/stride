name: Build Assembly Processor

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Build Configuration
        default: Debug
        type: choice
        options:
          - Debug
          - Release
  workflow_call:
    inputs:
      build-type:
        default: Debug
        type: string

concurrency:
  group: build-assembly-processor-${{ github.event.pull_request.number || github.sha }}-${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }}
  cancel-in-progress: true

jobs:
  #
  # Build Assembly Processor
  #
  Assembly-Processor:
    name: Assembly Processor (${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }})
    runs-on: windows-2025-vs2026
    steps:
      # Bootstrap .github so the local composite action below is resolvable pre-checkout.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/stride-checkout
        with:
          ref: ${{ github.ref }}
          exclude: samples
      - name: Build
        run: |
          dotnet build build\Stride.AssemblyProcessor.slnx `
            -restore -nr:false `
            -v:m -p:WarningLevel=0 `
            -p:Configuration=${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }} `
            -p:StrideSkipUnitTests=true `
            -p:StrideSkipAutoPack=true
      # The Release build is reproducible: it must give the committed deps/AssemblyProcessor bytes
      - name: Compare with the committed binaries
        if: (github.event.inputs.build-type || inputs.build-type) == 'Release'
        shell: pwsh
        run: |
          $hashes = Get-ChildItem deps/AssemblyProcessor -Recurse -File -Include *.dll, *.pdb |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), (Resolve-Path -Relative $_) }
          $changed = git status --porcelain deps/AssemblyProcessor
          @("Commit: $(git rev-parse HEAD)", "SDK: $(dotnet --version)", '```') + $hashes + @('```') | Add-Content $env:GITHUB_STEP_SUMMARY
          $hashes
          if ($changed) {
            $changed
            echo "::error::The built AssemblyProcessor differs from the committed deps/AssemblyProcessor"
            exit 1
          }
