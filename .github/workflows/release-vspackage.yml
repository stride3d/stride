name: Release VS Package

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to NuGet.org
        default: false
        type: boolean
      upload-binlog:
        description: Capture and upload an MSBuild binlog (diagnostics). The build has no secrets, so it may hold the binlog.
        default: false
        type: boolean
      version-suffix:
        description: Prerelease suffix for the NuGet package, no leading dash (e.g. "beta1" -> 4.4.0-beta1). Empty = stable. The .vsix manifest version is numeric-only, so it always ships the suffix-less 4.4.0.0.
        default: ''
        type: string

concurrency:
  group: release-vspackage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can't read team membership: the Stride Bot app can (Organization Members: Read).
      - name: Get the Stride Bot token
        id: bot
        if: ${{ inputs.deploy }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STRIDE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.STRIDE_BOT_PRIVATE_KEY }}
          permission-members: read

      - name: Check release permissions
        if: ${{ inputs.deploy }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          ORG=$(echo "${{ github.repository }}" | cut -d/ -f1)
          TEAM="stride-release-managers"
          USER="${{ github.actor }}"
          # A 404 here means either the actor isn't a member OR the token can't read the team
          # (app without Organization Members: Read); the message covers both since the API can't distinguish them.
          if ! gh api "orgs/$ORG/teams/$TEAM/memberships/$USER" --silent 2>/dev/null; then
            echo "::error::Deploy blocked: '$USER' is not a member of $ORG/$TEAM, or the Stride Bot token cannot read it (missing Organization Members: Read). Requires stride-release-managers membership."
            exit 1
          fi

  Package:
    name: Package VS Extension
    needs: Validate
    runs-on: windows-2025-vs2026
    # No environment and no secrets: the packages are signed by the Deploy job, in production.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build VS Package
        run: |
          # --no-restore: the VSIXPlugin target restores its solution itself.
          dotnet build build\package.proj `
            -t:VSIXPlugin `
            --no-restore `
            ${{ inputs.upload-binlog && '-bl' || '' }} -m -nr:false `
            -p:StrideSign=false `
            -p:VersionSuffix=${{ inputs.version-suffix }}

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path bin/vsix -Filter "*.nupkg" | Select-Object -First 1
          if (-not ($nupkg -and $nupkg.BaseName -match '\.(\d+\.\d+\.\d+.*)$')) {
            echo "::error::Could not determine a version from the VS package nupkg name"
            exit 1
          }
          $version = $Matches[1]
          if ($version -notmatch '^\d+\.\d+\.\d+(-(alpha|beta|rc|preview)\d+)?$') {
            echo "::error::Version '$version' is not an allowed release version. Use X.Y.Z or X.Y.Z-(alpha|beta|rc|preview)<N> (e.g. 4.4.0, 4.4.0-beta1)"
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload VSIX artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stride-vsix-${{ steps.version.outputs.version }}
          path: bin/vsix/*.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.upload-binlog }}
        with:
          name: build-log
          path: msbuild.binlog
          if-no-files-found: ignore

  Deploy:
    name: Deploy VS Package
    if: ${{ inputs.deploy }}
    needs: Package
    runs-on: windows-2025  # the sign tool needs Windows
    environment: production  # requires manual approval in GitHub settings
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: 1  # Git Bash: keep tag and path arguments as they are
    permissions:
      contents: read
      id-token: write # nuget.org trusted publishing
    steps:
      # The Stride Release app's key is only in the production environment, and the app may pass the master ruleset.
      - name: Get the Stride Release token
        id: release
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STRIDE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.STRIDE_RELEASE_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7  # full history + tags for the vspackage-scoped changelog and tagging
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.release.outputs.token }}  # push the vspackage/<version> tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          name: stride-vsix-${{ needs.Package.outputs.version }}
          path: bin/vsix

      - name: Sign
        run: dotnet build build/package.proj -t:SignVSIXPlugin --no-restore -p:StrideSign=true
        env:
          StrideSignTenantId: ${{ secrets.STRIDE_SIGN_TENANT_ID }}
          StrideSignClientId: ${{ secrets.STRIDE_SIGN_CLIENT_ID }}
          StrideSignClientSecret: ${{ secrets.STRIDE_SIGN_CLIENT_SECRET }}
          StrideSignKeyVaultCertificate: ${{ secrets.STRIDE_SIGN_KEYVAULT_CERTIFICATE }}
          StrideSignKeyVaultName: ${{ secrets.STRIDE_SIGN_KEYVAULT_NAME }}

      # A short-lived key from nuget.org's trusted publishing policy for this workflow file, instead of a stored one
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.STRIDE_NUGET_USER }}

      - name: Push to NuGet
        shell: pwsh
        run: |
          Get-ChildItem -Path bin/vsix -Filter "*.nupkg" | ForEach-Object {
            echo "Pushing $($_.Name)..."
            dotnet nuget push $_.FullName --api-key $env:STRIDE_NUGET_API_KEY --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }
        env:
          STRIDE_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Tag release
        run: |
          TAG="vspackage/${{ needs.Package.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
        run: |
          TAG="vspackage/${{ needs.Package.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            # The VS package is a separate product from the engine. Build its changelog from the
            # previous vspackage/* tag and scope it to the VS package sources, so engine/CLI commits
            # don't leak in (and the products' changelogs don't interleave, as GitHub's auto notes would).
            PREV=$(git describe --tags --abbrev=0 --match 'vspackage/*' "$TAG^" 2>/dev/null || true)
            RANGE="$TAG"
            [ -n "$PREV" ] && RANGE="$PREV..$TAG"
            NOTES=$(git log --no-merges --pretty='- %s (%h)' "$RANGE" -- sources/tools/Stride.VisualStudio.*)
            [ -z "$NOTES" ] && NOTES="_No VS package-specific changes since the previous release._"
            {
              echo "## What's changed in the Stride Visual Studio package"
              echo ""
              echo "$NOTES"
              if [ -n "$PREV" ]; then
                echo ""
                echo "**Full VS package changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$PREV...$TAG"
              fi
            } > vspackage-notes.md
            # Separate product: never the repository's "Latest" release (that's the engine).
            gh release create "$TAG" \
              --title "Stride VS Package ${{ needs.Package.outputs.version }}" \
              --notes-file vspackage-notes.md \
              --latest=false \
              bin/vsix/*.nupkg
          fi

  #
  # AI release notes, off the Deploy critical path (see release-notes-apply.yml). Runs after
  # the release exists; replaces the scoped git-log body with the AI bullet list.
  #
  ReleaseNotes:
    name: Release notes vspackage/${{ needs.Package.outputs.version }}
    needs: [Package, Deploy]
    if: ${{ needs.Package.outputs.version != '' }}
    permissions:
      contents: read       # passed down only as the model's read-only token; apply uses the Stride Bot token
      pull-requests: read  # lets the model trace commits to their PRs
    uses: ./.github/workflows/release-notes-apply.yml
    with:
      tag: vspackage/${{ needs.Package.outputs.version }}
      tag-match: 'vspackage/*'
      product: the Stride Visual Studio package
      scope: sources/tools/Stride.VisualStudio.*
      apply: true
    secrets:
      bot-private-key: ${{ secrets.STRIDE_BOT_PRIVATE_KEY }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY_RELEASE_NOTES }}
