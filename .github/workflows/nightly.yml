name: Nightly
# Builds the engine packages of a branch as X.Y.Z-nightly.YYYYMMDD.N (unsigned) and pushes them to the nightly feed,
# https://packages.stride3d.net/nightly/index.json, a static Sleet feed in the stridenightly storage account.
# The schedule runs on master, which starts the same workflow on each branch of NIGHTLY_BRANCHES. A run builds only
# when its branch changed since its last published nightly and its CI passed (see the Check job).
# The samples content isn't packed: the engine names the published content, as a release does.

on:
  schedule:
    # 19:23 UTC daily (04:23 JST), off the top of the hour.
    - cron: '23 19 * * *'
  # Each CI run that ends on master or on a branch of NIGHTLY_BRANCHES checks that branch again: the nightly publishes
  # as soon as CI passes, including when a failed CI passes in a rerun of its failed jobs. These runs always use
  # master's copy of this file, which starts the branch's own.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, 'master-*']
  workflow_dispatch:
    inputs:
      publish:
        description: Push the packages to the nightly feed (master and master-x.y only)
        default: true
        type: boolean
      force:
        description: Build even when the branch hasn't changed since its last published nightly or its tests failed
        default: false
        type: boolean

env:
  # Branches the scheduled run starts besides master (each needs this workflow and the nightly environment)
  NIGHTLY_BRANCHES: master-4.4
  # Nightlies kept per package and major.minor
  NIGHTLY_KEEP: 14

permissions:
  contents: read

concurrency:
  # By the branch checked: a CI run that ends on another branch only starts that branch's nightly
  group: nightly-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  #
  # Skip when nothing changed or the tests didn't pass, and choose the version label
  #
  Check:
    name: Check
    # Fork-friendly: the schedule and the CI runs start it only when STRIDE_ENABLE_SCHEDULED_CI is set on the
    # repository. CI runs of pull requests (from a fork's master) don't count.
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.STRIDE_ENABLE_SCHEDULED_CI == 'true') &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write      # reads the CI runs, starts the runs of the other branches
      deployments: read   # reads the last publish
    outputs:
      build: ${{ steps.check.outputs.build }}
      label: ${{ steps.check.outputs.label }}
    steps:
      - name: Start the other branches
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in $NIGHTLY_BRANCHES; do
            gh workflow run nightly.yml -R "${{ github.repository }}" --ref "$b" \
              || echo "::warning::Could not start the nightly of $b (does the branch have this workflow?)"
          done

      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          skip() {
            echo "::$1::$2"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A CI run that ended on another branch: that branch's own copy of this workflow checks it
          if [ -n "$RUN_BRANCH" ] && [ "$RUN_BRANCH" != "$BRANCH" ]; then
            case " $NIGHTLY_BRANCHES " in
              *" $RUN_BRANCH "*)
                gh workflow run nightly.yml -R "$REPO" --ref "$RUN_BRANCH" \
                  || echo "::warning::Could not start the nightly of $RUN_BRANCH (does the branch have this workflow?)"
                skip notice "The run ended on $RUN_BRANCH: the nightly of $RUN_BRANCH checks it." ;;
              *)
                skip notice "$RUN_BRANCH has no nightly." ;;
            esac
          fi

          # The last publish of this branch: the newest successful deployment to the nightly environment
          deployments=$(gh api "repos/$REPO/deployments?environment=nightly&ref=$BRANCH&per_page=10" \
            --jq '.[] | "\(.id) \(.sha) \(.created_at)"')
          LAST_SHA=""
          while read -r id sha at; do
            [ -n "$id" ] || continue
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = "success" ]; then
              LAST_SHA=$sha
              break
            fi
          done <<< "$deployments"
          if [ "$LAST_SHA" = "$SHA" ] && [ "$FORCE" != "true" ]; then
            skip notice "$BRANCH is at $SHA, already published by its last nightly: nothing to do."
          fi

          # CI of the newest push it ran for, which runs all the tests, must have passed: the commits after it only
          # touch files that CI ignores. A run still going isn't waited for: its end starts this check again.
          if [ "$FORCE" != "true" ]; then
            run=$(gh api "repos/$REPO/actions/workflows/main.yml/runs?branch=$BRANCH&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            read -r status conclusion url <<< "$run"
            if [ -z "$run" ]; then
              skip notice "CI has no push run on $BRANCH: not publishing."
            fi
            if [ "$status" != "completed" ]; then
              skip notice "CI is still running on $BRANCH ($url): its end checks again."
            fi
            if [ "$conclusion" != "success" ]; then
              skip warning "CI did not pass on $BRANCH ($conclusion, $url): no nightly until it passes."
            fi
            echo "CI passed: $url"
          fi
          LABEL="nightly.$(date -u +%Y%m%d).${{ github.run_number }}"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Version label: $LABEL"

  #
  # Build the packages (same build as release.yml, unsigned, without the prerequisites installer)
  #
  Package:
    name: Package
    needs: Check
    if: needs.Check.outputs.build == 'true'
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/runner-folders

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Apple Workloads
        # VS provisions the android workload but not ios/macos.
        uses: ./.github/actions/stride-workload
        with:
          workloads: ios macos

      - name: Build Package
        run: |
          dotnet build build\package.proj `
            -t:Package `
            --no-restore `
            -m -nr:false `
            -p:StridePlatforms=Windows%3BLinux%3BAndroid%3BiOS%3BmacOS `
            -p:StrideGraphicsApiDependentBuildAll=true `
            -p:StrideSign=false `
            -p:StrideBuildPrerequisitesInstaller=false `
            -p:StrideNightlyLabel=${{ needs.Check.outputs.label }} `
            -p:StrideNativeBuildMode=Clang
        env:
          StrideDisableAssetCompilerExecServerProxy: true

      - name: Detect version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path bin/packages -Filter "Stride.Core.*.nupkg" | Select-Object -First 1
          if (-not $pkg) {
            echo "::error::No Stride.Core package found"
            exit 1
          }
          $version = $pkg.Name -replace 'Stride\.Core\.(.*?)\.nupkg','$1'
          if ($version -notmatch '^\d+\.\d+\.\d+-nightly\.\d{8}\.\d+$') {
            echo "::error::Version '$version' is not a nightly version (X.Y.Z-nightly.YYYYMMDD.N)"
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "::notice::Package version: $version"
          # Packages with their own version (Stride.CrashReporter) append the label: a version not released yet
          # must never reach the feed under its release number
          $label = "${{ needs.Check.outputs.label }}"
          $other = Get-ChildItem -Path bin/packages -Filter "*.nupkg" | Where-Object { $_.Name -notlike "*.$label.nupkg" -and $_.Name -notlike "*-$label.nupkg" }
          if ($other) {
            echo "::error::Packages without the nightly label: $($other.Name -join ', ')"
            exit 1
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: stride-packages-${{ steps.version.outputs.version }}
          path: bin/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

  #
  # Push to the nightly feed
  #
  Publish:
    name: Publish ${{ needs.Package.outputs.version }}
    needs: Package
    if: (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/master-')) && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    # The environment holds AZURE_CLIENT_ID/AZURE_TENANT_ID of the stride-nightly-ci managed identity, whose
    # federated credential trusts this environment only (and the environment, master and the listed master-x.y).
    environment: nightly
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stride-packages-${{ needs.Package.outputs.version }}
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Push to the nightly feed
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          dotnet tool install --global sleet --version 7.2.0
          # Sleet signs in through DefaultAzureCredential: the workload identity reads the GitHub OIDC token from a
          # file. The token is short-lived: fetch a fresh one before each Sleet command.
          export AZURE_FEDERATED_TOKEN_FILE="$RUNNER_TEMP/oidc-token"
          sleet_run() {
            curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value > "$AZURE_FEDERATED_TOKEN_FILE"
            sleet "$@" --config sleet.json --source nightly
          }
          cat > sleet.json <<'EOF'
          {
            "config": { "feedLockTimeoutMinutes": 30 },
            "sources": [
              {
                "name": "nightly",
                "type": "azure",
                "container": "nightly",
                "path": "https://stridenightly.blob.core.windows.net/nightly/",
                "baseURI": "https://packages.stride3d.net/nightly/"
              }
            ]
          }
          EOF
          sleet_run push packages

          # Retention: the NIGHTLY_KEEP newest nightlies of each package and major.minor (Sleet's own retention
          # counts per package only, so a busy line would push out the nightlies of a quiet one)
          python3 - packages > prune.txt <<'EOF'
          import gzip, json, os, re, sys, urllib.error, urllib.request
          keep = int(os.environ["NIGHTLY_KEEP"])
          # X.Y.Z-nightly.D.N, or X.Y.Z-<prerelease>.nightly.D.N for packages with their own version
          nightly = re.compile(r"^(\d+)\.(\d+)\.(\d+)-(?:[0-9A-Za-z-]+\.)?nightly\.(\d{8})\.(\d+)$")
          ids = sorted({re.sub(r"\.\d+\.\d+\.\d+-.*\.nupkg$", "", f) for f in os.listdir(sys.argv[1]) if f.endswith(".nupkg")})
          for id in ids:
              url = f"https://stridenightly.blob.core.windows.net/nightly/flatcontainer/{id.lower()}/index.json"
              try:
                  with urllib.request.urlopen(url) as r:
                      data = r.read()
                      if r.headers.get("Content-Encoding") == "gzip":
                          data = gzip.decompress(data)
              except urllib.error.HTTPError:
                  continue
              lines = {}
              for v in json.loads(data)["versions"]:
                  m = nightly.match(v)
                  if m:
                      lines.setdefault(m.group(1, 2), []).append((tuple(int(x) for x in m.groups()), v))
              for versions in lines.values():
                  for _, v in sorted(versions, reverse=True)[keep:]:
                      print(id, v)
          EOF
          while read -r id version <&3; do
            echo "Pruning $id $version"
            sleet_run delete --id "$id" --version "$version"
          done 3< prune.txt
          {
            echo "## Nightly ${{ needs.Package.outputs.version }}"
            echo ""
            echo "Feed: \`https://packages.stride3d.net/nightly/index.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
