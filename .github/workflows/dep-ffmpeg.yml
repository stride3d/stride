name: "Dep: Build & Deploy FFmpeg"

# Builds FFmpeg twice per platform:
#   1. ffmpeg-libs-<rid>: LGPL shared libav* libraries shipped with the game runtime via
#      deps/FFmpeg/dotnet/<rid>/. MUST match the FFmpeg.AutoGen NuGet major version.
#   2. ffmpeg-cli-<rid>: GPL static ffmpeg executable with libx264 + platform HW encoders.
#      Used by the editor's asset compiler via ToolLocator.LocateTool("ffmpeg").
#      The GPL CLI does not contaminate the LGPL libs: they are produced from independent
#      configure/build invocations against separate prefixes.
# ffmpeg-version holds deps/FFmpeg/VERSION.txt: the version (dep-version.ps1) and the commits of FFmpeg, x264 and
# nv-codec-headers it built.
#
# Debug files: the libs compile with debug info, and ship without it and without their local symbols
# (dep-split-debug.sh). The debug files (.pdb, .so.debug, .dSYM) go to the symbols pre-release (dep-symbols.yml), as
# symbols-ffmpeg-<rid> artifacts. On Windows, the libs build with clang and lld: gcc emits no CodeView, so it makes no
# .pdb. The libs build outside the source tree, which keeps the object files that dsymutil reads on macOS. The CLI is
# built without debug info and stripped.
#
# Slimming strategy: --disable-everything then explicit --enable-* per category.
# Decoders + demuxers + parsers stay BROAD (covers ProRes/DNxHD/AC-3 etc. — anything
# an artist might realistically feed in). Encoders/muxers/filters/protocols stay NARROW
# (only what we actually emit). HW encoders enabled per platform.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: FFmpeg ref (must match FFmpeg.AutoGen NuGet major version)
        default: n9.1
        required: false
      x264_ref:
        description: x264 ref (used by the CLI build only)
        default: stable
        required: false
      nv_codec_headers_ref:
        description: nv-codec-headers ref (used by the Windows x64 CLI only)
        default: 33a9ede8d9914299d9262539c576a15bd0a19621
        required: false

env:
  FFMPEG_REPOSITORY: https://git.ffmpeg.org/ffmpeg.git
  X264_REPOSITORY: https://code.videolan.org/videolan/x264.git
  NV_CODEC_HEADERS_REPOSITORY: https://github.com/FFmpeg/nv-codec-headers.git
  # YAML `>-` folds newlines into spaces, which would break FFmpeg's comma-separated
  # --enable-* lists. Keep each value on a single line.
  # Decoders: broad — covers anything an artist might import (ProRes/DNxHD/AC-3 etc.).
  COMMON_DECODERS: "h264,hevc,vp8,vp9,av1,mjpeg,mpeg4,mpeg2video,mpeg1video,prores,dnxhd,theora,hap,gif,aac,aac_latm,mp3,mp3float,vorbis,opus,flac,ac3,eac3,alac,pcm_f32le,pcm_f32be,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s24be,pcm_s32le,pcm_s32be,pcm_u8,pcm_s8,pcm_mulaw,pcm_alaw"
  # Demuxers: broad — input container coverage.
  COMMON_DEMUXERS: "mov,matroska,ogg,avi,mpegts,mpegps,mpegvideo,asf,flv,wav,mp3,flac,aac,mxf,rawvideo,h264,hevc"
  # Parsers: matches the decoder set so streams advance cleanly.
  COMMON_PARSERS: "h264,hevc,vp8,vp9,av1,mjpeg,mpeg4video,mpegvideo,mpegaudio,aac,aac_latm,vorbis,opus,flac,ac3,gif"
  # Bitstream filters: H.264/HEVC mp4toannexb + a couple metadata BSFs.
  COMMON_BSFS: "h264_mp4toannexb,hevc_mp4toannexb,vp9_metadata,av1_metadata,extract_extradata,aac_adtstoasc"

jobs:
  # The builds fetch these commits, so every platform gets the same sources even when a ref moves during the run.
  resolve:
    name: Resolve source refs and version
    runs-on: ubuntu-24.04
    outputs:
      ffmpeg: ${{ steps.resolve.outputs.ffmpeg }}
      x264: ${{ steps.resolve.outputs.x264 }}
      nvcodec: ${{ steps.resolve.outputs.nvcodec }}
      number: ${{ steps.version.outputs.number }}
    env:
      FFMPEG_REF: ${{ github.event.inputs.ref || 'n9.1' }}
      X264_REF: ${{ github.event.inputs.x264_ref || 'stable' }}
      NVCODEC_REF: ${{ github.event.inputs.nv_codec_headers_ref || '33a9ede8d9914299d9262539c576a15bd0a19621' }}
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Resolve refs to commits
        id: resolve
        run: |
          # Prints the commit that a ref (branch, tag or SHA) of a repository points to
          resolve() {
            git init -q "$1"
            git -C "$1" remote add origin "$2"
            git -C "$1" fetch -q --depth 1 --filter=tree:0 origin "$3"
            git -C "$1" rev-parse 'FETCH_HEAD^{commit}'
          }
          FFMPEG=$(resolve ffmpeg "$FFMPEG_REPOSITORY" "$FFMPEG_REF")
          X264=$(resolve x264 "$X264_REPOSITORY" "$X264_REF")
          NVCODEC=$(resolve nv-codec-headers "$NV_CODEC_HEADERS_REPOSITORY" "$NVCODEC_REF")
          { echo "ffmpeg=$FFMPEG"; echo "x264=$X264"; echo "nvcodec=$NVCODEC"; } >> "$GITHUB_OUTPUT"

      # FFmpeg's configure reads its version from the RELEASE file. A release without a patch number gets .0, so that
      # the build number doesn't read as one: 9.1.0.1 is the first build of 9.1, and 9.1.1.1 the first of 9.1.1.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $commit = '${{ steps.resolve.outputs.ffmpeg }}'
          $file = git -C ffmpeg show "${commit}:RELEASE"
          if ($file.Count -ne 1 -or $file -notmatch '^\d+\.\d+(\.\d+)?$') { throw "RELEASE isn't one line 'N.N[.N]': '$file'" }
          $official = if ($file -match '^\d+\.\d+$') { "$file.0" } else { $file }
          stride-src/.github/scripts/dep-version.ps1 -Name ffmpeg -Official $official `
            -Source ffmpeg -Commit $commit -Upstream $env:FFMPEG_REPOSITORY -TagPrefix n

      - name: Write VERSION.txt
        env:
          FFMPEG: ${{ steps.resolve.outputs.ffmpeg }}
          X264: ${{ steps.resolve.outputs.x264 }}
          NVCODEC: ${{ steps.resolve.outputs.nvcodec }}
        run: |
          cat > VERSION.txt <<EOF
          FFmpeg $FFMPEG_REF
          Version: ${{ steps.version.outputs.version }}
          Repository: $FFMPEG_REPOSITORY
          Commit: $FFMPEG

          x264 $X264_REF (CLI only)
          Repository: $X264_REPOSITORY
          Commit: $X264

          nv-codec-headers $NVCODEC_REF (Windows x64 CLI only)
          Repository: $NV_CODEC_HEADERS_REPOSITORY
          Commit: $NVCODEC

          Stride: ${{ github.server_url }}/${{ github.repository }} @ ${{ github.sha }}
          Built: $(date -u +%Y-%m-%d)
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          echo "Debug files: ${{ github.server_url }}/${{ github.repository }}/releases/tag/deps/ffmpeg/${{ steps.version.outputs.number }}" >> VERSION.txt
          cat VERSION.txt

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-version, path: VERSION.txt }

  # ====================================================================
  # Linux x64
  # ====================================================================
  linux-x64:
    name: Build FFmpeg (Linux x64)
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm pkg-config diffutils \
            libva-dev libdrm-dev

      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Clone FFmpeg
        run: |
          git init ffmpeg-src
          git -C ffmpeg-src remote add origin "$FFMPEG_REPOSITORY"
          git -C ffmpeg-src fetch --depth 1 origin "${{ needs.resolve.outputs.ffmpeg }}"
          git -C ffmpeg-src checkout FETCH_HEAD

      - name: Clone & build x264 (static)
        run: |
          git init x264-src
          git -C x264-src remote add origin "$X264_REPOSITORY"
          git -C x264-src fetch --depth 1 origin "${{ needs.resolve.outputs.x264 }}"
          git -C x264-src checkout FETCH_HEAD
          cd x264-src
          ./configure --enable-static --disable-shared --enable-pic --prefix="$PWD/../x264-install"
          make -j"$(nproc)"
          make install

      - name: Configure & build libs (LGPL shared, decode-focused)
        run: |
          mkdir ffmpeg-libs-build && cd ffmpeg-libs-build
          ../ffmpeg-src/configure --prefix="$PWD/../ffmpeg-libs-install" \
            --enable-shared --disable-static \
            --disable-programs --disable-doc --disable-stripping \
            --disable-network --disable-everything --disable-xlib --disable-libxcb --disable-libxcb-shm --disable-libxcb-shape --disable-libxcb-xfixes --disable-iconv \
            --enable-small --enable-pic \
            --enable-decoder=${COMMON_DECODERS} \
            --enable-demuxer=${COMMON_DEMUXERS} \
            --enable-parser=${COMMON_PARSERS} \
            --enable-bsf=${COMMON_BSFS} \
            --enable-protocol=file,subfile \
            --enable-filter=scale,format,aformat,aresample \
            --enable-encoder=pcm_f32le,pcm_s16le,pcm_s24le \
            --enable-muxer=pcm_f32le,wav,mp4,rawvideo
          make -j"$(nproc)"
          make install

      - name: Configure & build CLI (GPL static, libx264 + VA-API)
        working-directory: ffmpeg-src
        run: |
          PKG_CONFIG_PATH="$PWD/../x264-install/lib/pkgconfig" ./configure --prefix="$PWD/../ffmpeg-cli-install" \
            --enable-static --disable-shared \
            --enable-gpl --enable-libx264 --enable-vaapi \
            --disable-doc --disable-debug \
            --disable-network --disable-everything --disable-xlib --disable-libxcb --disable-libxcb-shm --disable-libxcb-shape --disable-libxcb-xfixes --disable-iconv \
            --enable-small --enable-pic \
            --pkg-config-flags=--static \
            --extra-cflags="-I../x264-install/include" \
            --extra-ldflags="-L../x264-install/lib" \
            --enable-decoder=${COMMON_DECODERS} \
            --enable-demuxer=${COMMON_DEMUXERS} \
            --enable-parser=${COMMON_PARSERS} \
            --enable-bsf=${COMMON_BSFS} \
            --enable-protocol=file,pipe,subfile \
            --enable-filter=scale,format,fps,crop,setdar,setsar,transpose,vflip,hflip,aformat,aresample,hwupload,hwdownload,hwmap \
            --enable-encoder=libx264,h264_vaapi,hevc_vaapi,aac,pcm_f32le,pcm_s16le,pcm_s24le \
            --enable-muxer=mp4,mov,matroska,webm,wav,ogg,null,pcm_f32le,rawvideo
          make -j"$(nproc)"
          make install

      - name: Collect lib artifact
        run: |
          # Rename to SONAME (libavcodec.so.63.24.100 → libavcodec.so.63) so .NET
          # DllImport / dlopen finds them via the major-version name FFmpeg.AutoGen requests.
          for f in ffmpeg-libs-install/lib/libav*.so.* ffmpeg-libs-install/lib/libsw*.so.*; do
            [ -L "$f" ] && continue
            base=$(basename "$f")
            short=$(echo "$base" | sed -E 's/^(lib[a-z]+)\.so\.([0-9]+)\.[0-9]+\.[0-9]+$/\1.so.\2/')
            stride-src/.github/scripts/dep-split-debug.sh "$f" out-libs symbols "$short"
          done
          ls -la out-libs/ symbols/
          du -sh out-libs/

      - name: Collect CLI artifact
        run: |
          mkdir -p out-cli/linux-x64
          cp ffmpeg-cli-install/bin/ffmpeg out-cli/linux-x64/
          strip out-cli/linux-x64/ffmpeg || true
          ls -la out-cli/linux-x64/
          du -sh out-cli/

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-libs-linux-x64, path: out-libs/ }

      - uses: actions/upload-artifact@v7
        with: { name: symbols-ffmpeg-linux-x64, path: symbols/ }

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-cli-linux-x64, path: out-cli/ }

  # ====================================================================
  # macOS ARM64
  # ====================================================================
  osx-arm64:
    name: Build FFmpeg (macOS arm64)
    needs: resolve
    runs-on: macos-15
    steps:
      - name: Install build deps
        run: brew install nasm pkg-config

      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Clone FFmpeg
        run: |
          git init ffmpeg-src
          git -C ffmpeg-src remote add origin "$FFMPEG_REPOSITORY"
          git -C ffmpeg-src fetch --depth 1 origin "${{ needs.resolve.outputs.ffmpeg }}"
          git -C ffmpeg-src checkout FETCH_HEAD

      - name: Clone & build x264 (static)
        run: |
          git init x264-src
          git -C x264-src remote add origin "$X264_REPOSITORY"
          git -C x264-src fetch --depth 1 origin "${{ needs.resolve.outputs.x264 }}"
          git -C x264-src checkout FETCH_HEAD
          cd x264-src
          ./configure --enable-static --disable-shared --enable-pic --prefix="$PWD/../x264-install"
          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      - name: Configure & build libs (LGPL shared, decode-focused)
        run: |
          mkdir ffmpeg-libs-build && cd ffmpeg-libs-build
          ../ffmpeg-src/configure --prefix="$PWD/../ffmpeg-libs-install" \
            --enable-shared --disable-static \
            --disable-programs --disable-doc --disable-stripping \
            --disable-network --disable-everything --disable-xlib --disable-libxcb --disable-libxcb-shm --disable-libxcb-shape --disable-libxcb-xfixes --disable-iconv \
            --enable-small --enable-pic \
            --install-name-dir=@rpath \
            --enable-decoder=${COMMON_DECODERS} \
            --enable-demuxer=${COMMON_DEMUXERS} \
            --enable-parser=${COMMON_PARSERS} \
            --enable-bsf=${COMMON_BSFS} \
            --enable-protocol=file,subfile \
            --enable-filter=scale,format,aformat,aresample \
            --enable-encoder=pcm_f32le,pcm_s16le,pcm_s24le \
            --enable-muxer=pcm_f32le,wav,mp4,rawvideo
          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      - name: Configure & build CLI (GPL static, libx264 + VideoToolbox)
        working-directory: ffmpeg-src
        run: |
          PKG_CONFIG_PATH="$PWD/../x264-install/lib/pkgconfig" ./configure --prefix="$PWD/../ffmpeg-cli-install" \
            --enable-static --disable-shared \
            --enable-gpl --enable-libx264 --enable-videotoolbox \
            --disable-doc --disable-debug \
            --disable-network --disable-everything --disable-xlib --disable-libxcb --disable-libxcb-shm --disable-libxcb-shape --disable-libxcb-xfixes --disable-iconv \
            --enable-small --enable-pic \
            --pkg-config-flags=--static \
            --extra-cflags="-I../x264-install/include" \
            --extra-ldflags="-L../x264-install/lib" \
            --enable-decoder=${COMMON_DECODERS} \
            --enable-demuxer=${COMMON_DEMUXERS} \
            --enable-parser=${COMMON_PARSERS} \
            --enable-bsf=${COMMON_BSFS} \
            --enable-protocol=file,pipe,subfile \
            --enable-filter=scale,format,fps,crop,setdar,setsar,transpose,vflip,hflip,aformat,aresample,hwupload,hwdownload,hwmap \
            --enable-encoder=libx264,h264_videotoolbox,hevc_videotoolbox,aac,pcm_f32le,pcm_s16le,pcm_s24le \
            --enable-muxer=mp4,mov,matroska,webm,wav,ogg,null,pcm_f32le,rawvideo
          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      - name: Collect lib artifact
        run: |
          # Rename to install_name (libavcodec.63.24.100.dylib → libavcodec.63.dylib) so .NET
          # DllImport / dlopen finds them via the major-version name FFmpeg.AutoGen requests.
          for f in ffmpeg-libs-install/lib/libav*.[0-9]*.dylib ffmpeg-libs-install/lib/libsw*.[0-9]*.dylib; do
            [ -L "$f" ] && continue
            base=$(basename "$f")
            short=$(echo "$base" | sed -E 's/^(lib[a-z]+)\.([0-9]+)\.[0-9]+\.[0-9]+\.dylib$/\1.\2.dylib/')
            stride-src/.github/scripts/dep-split-debug.sh "$f" out-libs symbols "$short"
          done
          ls -la out-libs/ symbols/
          du -sh out-libs/

      - name: Collect CLI artifact
        run: |
          mkdir -p out-cli/osx-arm64
          cp ffmpeg-cli-install/bin/ffmpeg out-cli/osx-arm64/
          strip out-cli/osx-arm64/ffmpeg || true
          ls -la out-cli/osx-arm64/
          du -sh out-cli/

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-libs-osx-arm64, path: out-libs/ }

      - uses: actions/upload-artifact@v7
        with: { name: symbols-ffmpeg-osx-arm64, path: symbols/ }

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-cli-osx-arm64, path: out-cli/ }

  # ====================================================================
  # Windows x64 (MSYS2 mingw64). pkg-config inside MSYS2 needs MSYS paths,
  # so we use relative ../x264-install paths from ffmpeg-src/ instead of
  # $GITHUB_WORKSPACE (which is a Windows DOS path).
  # ====================================================================
  win-x64:
    name: Build FFmpeg (Windows x64)
    needs: resolve
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          # UCRT64 (Universal C Runtime) is the modern mingw env. Its toolchain links against
          # api-ms-win-crt-*.dll (shipped with Windows 10+) instead of msvcrt + libwinpthread.
          # Important: clock_gettime/nanosleep used by libavutil resolve to UCRT natively here,
          # which keeps the libav* DLLs free of the libwinpthread-1.dll runtime dep that
          # MINGW64 unavoidably introduces.
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            diffutils
            git

      - name: Clone FFmpeg
        run: |
          git init ffmpeg-src
          git -C ffmpeg-src remote add origin "$FFMPEG_REPOSITORY"
          git -C ffmpeg-src fetch --depth 1 origin "${{ needs.resolve.outputs.ffmpeg }}"
          git -C ffmpeg-src checkout FETCH_HEAD

      - name: Clone & build x264 (static)
        run: |
          git init x264-src
          git -C x264-src remote add origin "$X264_REPOSITORY"
          git -C x264-src fetch --depth 1 origin "${{ needs.resolve.outputs.x264 }}"
          git -C x264-src checkout FETCH_HEAD
          cd x264-src
          ./configure --enable-static --disable-shared --enable-pic --prefix="$PWD/../x264-install"
          make -j"$(nproc)"
          make install

      # Headers-only project providing ffnvcodec.pc for NVENC. Tiny, builds in seconds.
      - name: Clone & install nv-codec-headers
        run: |
          git init nv-codec-src
          git -C nv-codec-src remote add origin "$NV_CODEC_HEADERS_REPOSITORY"
          git -C nv-codec-src fetch --depth 1 origin "${{ needs.resolve.outputs.nvcodec }}"
          git -C nv-codec-src checkout FETCH_HEAD
          make -C nv-codec-src PREFIX="$PWD/nv-codec-install" install

      # clang writes the debug info as CodeView (-gcodeview), which lld puts in a .pdb named after each DLL
      # (--pdb=). --strip-all leaves the DLL without symbol table and without the DWARF of the assembly files.
      - name: Configure & build libs (LGPL shared, decode-focused)
        run: |
          # --enable-w32threads switches FFmpeg from POSIX threads to Win32 native threads.
          # libavutil's clock_gettime64 still resolves through libwinpthread on gcc/mingw (UCRT
          # doesn't expose POSIX clock_gettime). Removing libwinpthread.dll.a forces the linker
          # to pick the static .a archive — end-user libav* DLLs no longer need libwinpthread-1.dll.
          rm -f /ucrt64/lib/libwinpthread.dll.a /ucrt64/lib/libpthread.dll.a
          mkdir ffmpeg-libs-build && cd ffmpeg-libs-build
          ../ffmpeg-src/configure --prefix="$PWD/../ffmpeg-libs-install" \
            --cc=clang \
            --enable-shared --disable-static \
            --enable-w32threads \
            --disable-programs --disable-doc --disable-stripping \
            --disable-network --disable-everything --disable-xlib --disable-libxcb --disable-libxcb-shm --disable-libxcb-shape --disable-libxcb-xfixes --disable-iconv --disable-bzlib --disable-zlib \
            --enable-small \
            --extra-cflags="-gcodeview" \
            --extra-ldflags="-static-libgcc -fuse-ld=lld -Wl,--pdb= -Wl,--strip-all" \
            --enable-decoder=${COMMON_DECODERS} \
            --enable-demuxer=${COMMON_DEMUXERS} \
            --enable-parser=${COMMON_PARSERS} \
            --enable-bsf=${COMMON_BSFS} \
            --enable-protocol=file,subfile \
            --enable-filter=scale,format,aformat,aresample \
            --enable-encoder=pcm_f32le,pcm_s16le,pcm_s24le \
            --enable-muxer=pcm_f32le,wav,mp4,rawvideo \
            --enable-hwaccel=h264_d3d11va,h264_d3d11va2,h264_dxva2,hevc_d3d11va,hevc_d3d11va2,hevc_dxva2,vp9_d3d11va,vp9_d3d11va2,vp9_dxva2,av1_d3d11va,av1_d3d11va2,av1_dxva2
          make -j"$(nproc)"
          make install

      # AMF dropped — its SDK headers require the heavyweight AMD AMF repo; libx264 + MF + NVENC
      # cover NVIDIA + universal Windows paths. AMD users fall back to MF (which uses VCN under
      # the hood on AMD GPUs anyway).
      - name: Configure & build CLI (GPL static, libx264 + MF + NVENC)
        working-directory: ffmpeg-src
        run: |
          PKG_CONFIG_PATH="$PWD/../x264-install/lib/pkgconfig:$PWD/../nv-codec-install/lib/pkgconfig" \
          ./configure --prefix="$PWD/../ffmpeg-cli-install" \
            --enable-static --disable-shared \
            --enable-w32threads \
            --enable-gpl --enable-libx264 \
            --enable-mediafoundation --enable-nvenc \
            --disable-doc --disable-debug \
            --disable-network --disable-everything --disable-xlib --disable-libxcb --disable-libxcb-shm --disable-libxcb-shape --disable-libxcb-xfixes --disable-iconv --disable-bzlib --disable-zlib \
            --enable-small \
            --pkg-config-flags=--static \
            --extra-cflags="-I../x264-install/include" \
            --extra-ldflags="-static -L../x264-install/lib" \
            --enable-decoder=${COMMON_DECODERS} \
            --enable-demuxer=${COMMON_DEMUXERS} \
            --enable-parser=${COMMON_PARSERS} \
            --enable-bsf=${COMMON_BSFS} \
            --enable-protocol=file,pipe,subfile \
            --enable-filter=scale,format,fps,crop,setdar,setsar,transpose,vflip,hflip,aformat,aresample,hwupload,hwdownload,hwmap \
            --enable-encoder=libx264,h264_mf,hevc_mf,h264_nvenc,hevc_nvenc,aac,pcm_f32le,pcm_s16le,pcm_s24le \
            --enable-muxer=mp4,mov,matroska,webm,wav,ogg,null,pcm_f32le,rawvideo
          make -j"$(nproc)"
          make install

      # The .pdb stays next to the DLL in the build folder: make install doesn't copy it
      - name: Collect lib artifact
        run: |
          mkdir -p out-libs symbols
          for dll in ffmpeg-libs-install/bin/av*.dll ffmpeg-libs-install/bin/sw*.dll; do
            pdb=(ffmpeg-libs-build/lib*/"$(basename "$dll" .dll).pdb")
            [ -f "${pdb[0]}" ] || { echo "::error::No .pdb for $(basename "$dll")"; exit 1; }
            cp "$dll" out-libs/
            cp "${pdb[0]}" symbols/
          done
          ls -la out-libs/ symbols/
          du -sh out-libs/

      - name: Collect CLI artifact
        run: |
          mkdir -p out-cli/win-x64
          cp ffmpeg-cli-install/bin/ffmpeg.exe out-cli/win-x64/
          strip out-cli/win-x64/ffmpeg.exe || true
          ls -la out-cli/win-x64/
          du -sh out-cli/

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-libs-win-x64, path: out-libs/ }

      - uses: actions/upload-artifact@v7
        with: { name: symbols-ffmpeg-win-x64, path: symbols/ }

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-cli-win-x64, path: out-cli/ }

  # ====================================================================
  # Windows ARM64 (MSYS2 clangarm64). CLANGARM64 ships clang but no cc/gcc
  # shim, so x264's configure (which defaults to $CC=cc) needs CC=clang.
  # AMF/NVENC are x64-only — skip on arm64.
  # ====================================================================
  win-arm64:
    name: Build FFmpeg (Windows arm64)
    needs: resolve
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            base-devel
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-nasm
            mingw-w64-clang-aarch64-pkgconf
            diffutils
            git

      - name: Clone FFmpeg
        run: |
          git init ffmpeg-src
          git -C ffmpeg-src remote add origin "$FFMPEG_REPOSITORY"
          git -C ffmpeg-src fetch --depth 1 origin "${{ needs.resolve.outputs.ffmpeg }}"
          git -C ffmpeg-src checkout FETCH_HEAD

      - name: Clone & build x264 (static)
        run: |
          git init x264-src
          git -C x264-src remote add origin "$X264_REPOSITORY"
          git -C x264-src fetch --depth 1 origin "${{ needs.resolve.outputs.x264 }}"
          git -C x264-src checkout FETCH_HEAD
          cd x264-src
          CC=clang ./configure --enable-static --disable-shared --enable-pic --prefix="$PWD/../x264-install"
          make -j"$(nproc)"
          make install

      # The debug info goes to a .pdb, as on x64
      - name: Configure & build libs (LGPL shared, decode-focused)
        run: |
          mkdir ffmpeg-libs-build && cd ffmpeg-libs-build
          ../ffmpeg-src/configure --prefix="$PWD/../ffmpeg-libs-install" \
            --cc=clang --arch=aarch64 --target-os=mingw32 \
            --enable-shared --disable-static \
            --enable-w32threads \
            --disable-programs --disable-doc --disable-stripping \
            --disable-network --disable-everything --disable-xlib --disable-libxcb --disable-libxcb-shm --disable-libxcb-shape --disable-libxcb-xfixes --disable-iconv --disable-bzlib --disable-zlib \
            --enable-small \
            --extra-cflags="-gcodeview" \
            --extra-ldflags="-Wl,--pdb= -Wl,--strip-all" \
            --enable-decoder=${COMMON_DECODERS} \
            --enable-demuxer=${COMMON_DEMUXERS} \
            --enable-parser=${COMMON_PARSERS} \
            --enable-bsf=${COMMON_BSFS} \
            --enable-protocol=file,subfile \
            --enable-filter=scale,format,aformat,aresample \
            --enable-encoder=pcm_f32le,pcm_s16le,pcm_s24le \
            --enable-muxer=pcm_f32le,wav,mp4,rawvideo \
            --enable-hwaccel=h264_d3d11va,h264_d3d11va2,h264_dxva2,hevc_d3d11va,hevc_d3d11va2,hevc_dxva2,vp9_d3d11va,vp9_d3d11va2,vp9_dxva2,av1_d3d11va,av1_d3d11va2,av1_dxva2
          make -j"$(nproc)"
          make install

      - name: Configure & build CLI (GPL static, libx264 + MediaFoundation)
        working-directory: ffmpeg-src
        run: |
          PKG_CONFIG_PATH="$PWD/../x264-install/lib/pkgconfig" ./configure --prefix="$PWD/../ffmpeg-cli-install" \
            --cc=clang --arch=aarch64 --target-os=mingw32 \
            --enable-static --disable-shared \
            --enable-w32threads \
            --enable-gpl --enable-libx264 --enable-mediafoundation \
            --disable-doc --disable-debug \
            --disable-network --disable-everything --disable-xlib --disable-libxcb --disable-libxcb-shm --disable-libxcb-shape --disable-libxcb-xfixes --disable-iconv --disable-bzlib --disable-zlib \
            --enable-small \
            --pkg-config-flags=--static \
            --extra-cflags="-I../x264-install/include" \
            --extra-ldflags="-static -L../x264-install/lib" \
            --enable-decoder=${COMMON_DECODERS} \
            --enable-demuxer=${COMMON_DEMUXERS} \
            --enable-parser=${COMMON_PARSERS} \
            --enable-bsf=${COMMON_BSFS} \
            --enable-protocol=file,pipe,subfile \
            --enable-filter=scale,format,fps,crop,setdar,setsar,transpose,vflip,hflip,aformat,aresample,hwupload,hwdownload,hwmap \
            --enable-encoder=libx264,h264_mf,hevc_mf,aac,pcm_f32le,pcm_s16le,pcm_s24le \
            --enable-muxer=mp4,mov,matroska,webm,wav,ogg,null,pcm_f32le,rawvideo
          make -j"$(nproc)"
          make install

      - name: Collect lib artifact
        run: |
          mkdir -p out-libs symbols
          for dll in ffmpeg-libs-install/bin/av*.dll ffmpeg-libs-install/bin/sw*.dll; do
            pdb=(ffmpeg-libs-build/lib*/"$(basename "$dll" .dll).pdb")
            [ -f "${pdb[0]}" ] || { echo "::error::No .pdb for $(basename "$dll")"; exit 1; }
            cp "$dll" out-libs/
            cp "${pdb[0]}" symbols/
          done
          ls -la out-libs/ symbols/
          du -sh out-libs/

      - name: Collect CLI artifact
        run: |
          mkdir -p out-cli/win-arm64
          cp ffmpeg-cli-install/bin/ffmpeg.exe out-cli/win-arm64/
          strip out-cli/win-arm64/ffmpeg.exe || true
          ls -la out-cli/win-arm64/
          du -sh out-cli/

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-libs-win-arm64, path: out-libs/ }

      - uses: actions/upload-artifact@v7
        with: { name: symbols-ffmpeg-win-arm64, path: symbols/ }

      - uses: actions/upload-artifact@v7
        with: { name: ffmpeg-cli-win-arm64, path: out-cli/ }

  symbols:
    needs: [resolve, linux-x64, osx-arm64, win-x64, win-arm64]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dep-symbols.yml
    with:
      name: ffmpeg
      version: ${{ needs.resolve.outputs.number }}
      notes-artifact: ffmpeg-version
