name: "Dep: Build Bullet"

# Builds libbulletc.{dll,so,dylib} per RID (the native C wrapper around bullet)
# plus the managed BulletSharp.dll (RID-agnostic). Replaces the binaries that
# used to ship in deps/BulletPhysics/ and were built off-tree.
#
# Upstream:
#   https://github.com/stride3d/BulletSharpPInvoke  (libbulletc + C# bindings)
#   bullet3 enters the build as a git submodule of the fork, pinned to the
#   commit libbulletc/*.cpp were last validated against. Bumping bullet means
#   bumping the submodule pin in the fork.
#
# Output per OS — one shared lib per RID + one managed dll:
#   Windows: libbulletc.dll
#   Linux:   libbulletc.so
#   macOS:   libbulletc.dylib
#   iOS:     libbulletc.a       (static, statically linked into the .app and
#                                 accessed via [DllImport("__Internal")])
#   Managed: BulletSharp.dll (built once, no RID)
#
# RIDs covered: win-x64, win-arm64, linux-x64, osx-arm64, ios-arm64,
#               iossimulator-arm64.
#
# Debug files: as in dep-freetype.yml, every build compiles with debug info, the libraries ship without it
# (dep-split-debug.sh), and the debug files go to the symbols pre-release (dep-symbols.yml).

on:
  workflow_dispatch:
    inputs:
      bulletsharp-repo:
        description: stride3d/BulletSharpPInvoke (or fork) repository
        default: stride3d/BulletSharpPInvoke
        required: true
      bulletsharp-ref:
        description: Branch/tag of the BulletSharpPInvoke repo to consume
        default: master
        required: true

jobs:
  # The builds check out this one commit, so every RID gets the same sources even when the ref moves during the run.
  resolve:
    name: Resolve BulletSharpPInvoke ref and version
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      bullet-commit: ${{ steps.version.outputs.bullet-commit }}
      version: ${{ steps.version.outputs.version }}
      number: ${{ steps.version.outputs.number }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Resolve ref to a commit
        id: resolve
        run: |
          git init -q bulletsharp-src
          git -C bulletsharp-src remote add origin "https://github.com/${{ github.event.inputs.bulletsharp-repo }}.git"
          git -C bulletsharp-src fetch -q --depth 1 --filter=tree:0 origin "${{ github.event.inputs.bulletsharp-ref }}"
          echo "commit=$(git -C bulletsharp-src rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      # The version is bullet3's, from the VERSION file of the submodule pin: BulletSharpPInvoke has none of its own
      - name: Version
        id: version
        shell: pwsh
        run: |
          $commit = '${{ steps.resolve.outputs.commit }}'
          git -C bulletsharp-src show "${commit}:.gitmodules" | Set-Content gitmodules
          $url = git config -f gitmodules submodule.bullet.url
          $pin = (git -C bulletsharp-src ls-tree $commit bullet) -split '\s+' | Select-Object -Index 2
          git init -q bullet-src
          git -C bullet-src remote add origin $url
          git -C bullet-src fetch -q --depth 1 --filter=tree:0 origin $pin
          $file = @(git -C bullet-src show "${pin}:VERSION")
          if ($file.Count -ne 1) { throw "bullet3's VERSION isn't one line: '$file'" }
          "bullet-commit=$pin" >> $env:GITHUB_OUTPUT
          stride-src/.github/scripts/dep-version.ps1 -Name bullet -Official $file[0].Trim() `
            -Source bulletsharp-src -Commit $commit -Upstream https://github.com/stride3d/BulletSharpPInvoke.git -UpstreamBranch master

  build-windows:
    name: Build libbulletc (Windows ${{ matrix.arch }})
    needs: resolve
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64
    steps:
      - name: Checkout BulletSharpPInvoke (+ bullet submodule)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.bulletsharp-repo }}
          ref: ${{ needs.resolve.outputs.commit }}
          submodules: recursive
          path: BulletSharpPInvoke

      - name: Patch bullet for ARM64 (NEON gate)
        if: matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          # btScalar.h gates SSE behind _M_ARM only; ARM64 must skip emmintrin.h too.
          (Get-Content BulletSharpPInvoke/bullet/src/LinearMath/btScalar.h) `
            -replace '^#if defined \(_M_ARM\)$', '#if defined (_M_ARM) || defined (_M_ARM64)' `
            | Set-Content BulletSharpPInvoke/bullet/src/LinearMath/btScalar.h

      - name: Strip BulletRobotics from Extras
        shell: pwsh
        run: |
          # BulletRobotics has a broken install() that breaks add_subdirectory; we never use it.
          # Bullet 2.89 lists every Extras subdir on ONE line, so drop just the word, not the line.
          (Get-Content BulletSharpPInvoke/bullet/Extras/CMakeLists.txt) `
            -replace 'BulletRobotics', '' `
            | Set-Content BulletSharpPInvoke/bullet/Extras/CMakeLists.txt

      - name: Configure & build libbulletc
        shell: pwsh
        env: { CFLAGS: /Z7, CXXFLAGS: /Z7, LDFLAGS: /DEBUG /OPT:REF /OPT:ICF }
        run: |
          cmake -S BulletSharpPInvoke/libbulletc -B _build -A ${{ matrix.arch }} `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build _build --config Release

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -Path "out/${{ matrix.rid }}", "symbols/${{ matrix.rid }}" -ItemType Directory -Force | Out-Null
          Copy-Item _build/lib/Release/libbulletc.dll "out/${{ matrix.rid }}/"
          Copy-Item _build/lib/Release/libbulletc.pdb "symbols/${{ matrix.rid }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: libbulletc-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-bullet-${{ matrix.rid }}
          path: symbols/${{ matrix.rid }}/

  build-linux:
    name: Build libbulletc (Linux x64)
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Checkout BulletSharpPInvoke (+ bullet submodule)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.bulletsharp-repo }}
          ref: ${{ needs.resolve.outputs.commit }}
          submodules: recursive
          path: BulletSharpPInvoke

      - name: Strip BulletRobotics from Extras
        # Bullet 2.89 lists every Extras subdir on ONE line, so drop just the word.
        run: sed -i 's/BulletRobotics//g' BulletSharpPInvoke/bullet/Extras/CMakeLists.txt

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure & build libbulletc
        env: { CFLAGS: -g, CXXFLAGS: -g }
        run: |
          cmake -S BulletSharpPInvoke/libbulletc -B _build -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build _build

      # CMake adds 'lib' prefix on Unix to a target already named 'libbulletc' -> liblibbulletc.so
      - name: Collect output
        run: stride-src/.github/scripts/dep-split-debug.sh _build/liblibbulletc.so out/linux-x64 symbols/linux-x64 libbulletc.so

      - uses: actions/upload-artifact@v7
        with:
          name: libbulletc-linux-x64
          path: out/linux-x64/

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-bullet-linux-x64
          path: symbols/linux-x64/

  build-macos:
    name: Build libbulletc (macOS arm64)
    needs: resolve
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Checkout BulletSharpPInvoke (+ bullet submodule)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.bulletsharp-repo }}
          ref: ${{ needs.resolve.outputs.commit }}
          submodules: recursive
          path: BulletSharpPInvoke

      - name: Strip BulletRobotics from Extras
        # Bullet 2.89 lists every Extras subdir on ONE line, so drop just the word.
        run: sed -i '' 's/BulletRobotics//g' BulletSharpPInvoke/bullet/Extras/CMakeLists.txt

      - name: Configure & build libbulletc
        env: { CFLAGS: -g, CXXFLAGS: -g }
        run: |
          cmake -S BulletSharpPInvoke/libbulletc -B _build -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build _build

      - name: Collect output
        run: stride-src/.github/scripts/dep-split-debug.sh _build/liblibbulletc.dylib out/osx-arm64 symbols/osx-arm64 libbulletc.dylib

      - uses: actions/upload-artifact@v7
        with:
          name: libbulletc-osx-arm64
          path: out/osx-arm64/

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-bullet-osx-arm64
          path: symbols/osx-arm64/

  build-ios:
    name: Build libbulletc (${{ matrix.rid }})
    needs: resolve
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: ios-arm64
            sysroot: iphoneos
          - rid: iossimulator-arm64
            sysroot: iphonesimulator
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Checkout BulletSharpPInvoke (+ bullet submodule)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.bulletsharp-repo }}
          ref: ${{ needs.resolve.outputs.commit }}
          submodules: recursive
          path: BulletSharpPInvoke

      - name: Strip BulletRobotics from Extras
        # Bullet 2.89 lists every Extras subdir on ONE line, so drop just the word.
        run: sed -i '' 's/BulletRobotics//g' BulletSharpPInvoke/bullet/Extras/CMakeLists.txt

      - name: Patch libbulletc to build as STATIC
        # iOS forbids loading arbitrary dylibs at runtime; libbulletc must be
        # linked into the app and reached via [DllImport("__Internal")].
        # libbulletc/CMakeLists.txt has `ADD_LIBRARY(${BULLETC_LIB} SHARED`
        # (uppercase macro, variable expansion); flip the type to STATIC.
        run: sed -i '' 's/\${BULLETC_LIB} SHARED/\${BULLETC_LIB} STATIC/' BulletSharpPInvoke/libbulletc/CMakeLists.txt

      - name: Configure & build libbulletc
        env: { CFLAGS: -g, CXXFLAGS: -g }
        run: |
          # Cross-compile (CMAKE_SYSTEM_NAME=iOS) reroots find_path() PATHS through
          # the iOS sysroot, so libbulletc's "find btBulletCollisionCommon.h in
          # ${PROJECT_SOURCE_DIR}/../bullet/src" misses the submodule on disk.
          # Pass BULLET_INCLUDE_DIR explicitly to bypass find_path entirely.
          cmake -S BulletSharpPInvoke/libbulletc -B _build -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sysroot }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBULLET_INCLUDE_DIR="$(pwd)/BulletSharpPInvoke/bullet/src"
          cmake --build _build

      - name: Merge bullet component archives into libbulletc.a
        # CMake STATIC archives only contain the target's own objects; dependent static libs
        # (BulletDynamics, BulletCollision, BulletSoftBody, LinearMath, …) aren't merged in.
        # SHARED builds on desktop bake those in at link time, but for iOS (forced to STATIC
        # above), the final .app link sees libbulletc references to btSolveDantzigLCP /
        # btAlignedAllocInternal / btSetTaskScheduler etc. with no definitions and fails.
        # libtool -static merges all the .a files produced by the libbulletc cmake build
        # (libbulletc itself + bullet's component archives) into a single fat archive.
        run: |
          set -e
          ARCHIVES=$(find _build -name '*.a' | sort -u)
          echo "Merging:"
          printf '  %s\n' $ARCHIVES
          libtool -static -o _build/liblibbulletc-merged.a $ARCHIVES
          mv _build/liblibbulletc-merged.a _build/liblibbulletc.a

      # CMake adds 'lib' prefix to target named 'libbulletc' → liblibbulletc.a
      - name: Collect output
        run: |
          stride-src/.github/scripts/dep-split-debug.sh _build/liblibbulletc.a \
            out/${{ matrix.rid }} symbols/${{ matrix.rid }} libbulletc.a

      - uses: actions/upload-artifact@v7
        with:
          name: libbulletc-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-bullet-${{ matrix.rid }}
          path: symbols/${{ matrix.rid }}/

  # Managed BulletSharp.dll is built locally as part of Stride.Physics — the
  # stride3d fork's .csproj has a PackageReference to Stride.Core.Mathematics
  # not available in this CI. Native libbulletc is what this workflow ships.

  collect:
    name: Collect all platforms
    needs: [resolve, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Organize into Release/ layout
        run: |
          OUT=libbulletc-out
          for rid in win-x64 win-arm64 linux-x64 osx-arm64 ios-arm64 iossimulator-arm64; do
            mkdir -p $OUT/Release/$rid
            cp artifacts/libbulletc-$rid/* $OUT/Release/$rid/ 2>/dev/null || true
          done

          {
            printf 'BulletSharpPInvoke %s\nVersion: %s\nRepository: https://github.com/%s\nCommit: %s\n' \
              "${{ github.event.inputs.bulletsharp-ref }}" \
              "${{ needs.resolve.outputs.version }}" \
              "${{ github.event.inputs.bulletsharp-repo }}" \
              "${{ needs.resolve.outputs.commit }}"
            if [ -n "${{ needs.resolve.outputs.source }}" ]; then echo "${{ needs.resolve.outputs.source }}"; fi
            printf '\nbullet3 (submodule pin)\nRepository: https://github.com/bulletphysics/bullet3\nCommit: %s\n\nStride: %s/%s @ %s\nBuilt: %s\nWorkflow: %s\n' \
              "${{ needs.resolve.outputs.bullet-commit }}" \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.sha }}" \
              "$(date -u +%Y-%m-%d)" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            # The symbols job creates this pre-release on stride3d/stride only
            if [ "${{ github.repository }}" = stride3d/stride ]; then
              echo "Debug files: ${{ github.server_url }}/${{ github.repository }}/releases/tag/deps/bullet/${{ needs.resolve.outputs.number }}"
            fi
          } > $OUT/VERSION.txt

      - name: List contents
        run: find libbulletc-out -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: libbulletc-all-platforms
          path: libbulletc-out/

  symbols:
    needs: [resolve, collect]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dep-symbols.yml
    with:
      name: bullet
      version: ${{ needs.resolve.outputs.number }}
      notes-artifact: libbulletc-all-platforms
