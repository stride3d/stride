name: Test Editor (Avalonia)

# Builds the cross-platform (Avalonia) editor and runs its test projects on Linux and Windows,
# with the code coverage of the Windows run when asked (main.yml does, for coverage-report.yml).
# The WPF editor stays covered by build-windows-full.yml (its build), test-editor-wpf.yml (its tests)
# and test-gamestudio-screenshots.yml (its screenshots).

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Build Configuration
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      test-filter:
        description: 'dotnet test --filter expression (blank = all tests)'
        type: string
        default: ''
      repeat:
        description: 'Rerun the filtered test set up to N times, stop on first failure (flake hunting). 1 = single run (default).'
        type: number
        default: 1
      coverage:
        description: Collect code coverage on Windows (artifact coverage-editor-avalonia)
        type: boolean
        default: false
  workflow_call:
    inputs:
      build-type:
        default: Debug
        type: string
      test-filter:
        default: ''
        type: string
      repeat:
        default: 1
        type: number
      # Collect code coverage on Windows (main.yml), for coverage-report.yml
      coverage:
        default: false
        type: boolean

concurrency:
  # A manual run never cancels or queues behind another one
  group: test-editor-avalonia-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.sha }}-${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }}
  cancel-in-progress: true

env:
  # The solution filter of the Avalonia editor and its tests (a subset of Stride.slnx).
  EDITOR_SOLUTION: sources/Stride.Editor.Avalonia.slnf
  BUILD_TYPE: ${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }}

jobs:
  Editor-Tests:
    name: ${{ matrix.name }} (Editor Avalonia, ${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: Linux
          - name: Windows
            os: windows-2025-vs2026
            platform: Windows
    env:
      # Windows only: the Linux run would cover nearly the same lines
      COVERAGE_SETTINGS: ${{ inputs.coverage && matrix.platform == 'Windows' && 'tests/coverage.runsettings' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ github.ref }}
      - uses: ./.github/actions/lfs-pull
      - uses: ./.github/actions/runner-folders
      - uses: ./.github/actions/unpublished-packages
      # With coverage, ContinuousIntegrationBuild=false keeps the real source paths in the pdbs (CI=true maps them
      # to /_/), so that the coverage report finds the sources; this job ships no package.
      - name: Build
        run: |
          dotnet build "$EDITOR_SOLUTION" \
            -nr:false \
            -v:m -p:WarningLevel=0 \
            -p:Configuration="$BUILD_TYPE" \
            -p:StridePlatforms=${{ matrix.platform }} \
            ${{ env.COVERAGE_SETTINGS != '' && '-p:ContinuousIntegrationBuild=false' || '' }}
      # Stride.GameStudio.Avalonia.Tests runs its tests one at a time (the application and the plugin registry are
      # process-wide), so it would be the longest part of the job. A second process runs its classes that start with
      # one of SHELL_LETTERS, and the solution runs everything else. Rebalance the letters when one part gets much longer.
      # Both processes run from the same output folder: coverage must instrument in memory (tests/coverage.runsettings).
      - name: Test
        id: test
        run: |
          FILTER="${{ github.event.inputs.test-filter || inputs.test-filter }}"
          REPEAT="${{ github.event.inputs.repeat || inputs.repeat || '1' }}"
          COVERAGE_ARG=()
          if [ -n "$COVERAGE_SETTINGS" ]; then COVERAGE_ARG=(--settings "$COVERAGE_SETTINGS"); fi
          # Runs the tests of a project or solution: TRX prefix, project or solution, more arguments of dotnet test
          run_tests() {
            dotnet test "$2" \
              --no-build \
              --logger:"trx;LogFilePrefix=$1" --results-directory TestResults \
              --blame-hang-timeout 5m --blame-hang-dump-type full \
              -p:Configuration="$BUILD_TYPE" \
              "${COVERAGE_ARG[@]}" "${@:3}"
          }
          # A test filter or a repeat (flake hunting) runs in a single process
          if [ -n "$FILTER" ] || [ "$REPEAT" -gt 1 ]; then
            FILTER_ARG=()
            if [ -n "$FILTER" ]; then FILTER_ARG=(--filter "$FILTER"); fi
            for i in $(seq 1 "$REPEAT"); do
              echo "=== Test run $i / $REPEAT ==="
              run_tests run-$i "$EDITOR_SOLUTION" "${FILTER_ARG[@]}" || { ec=$?; echo "Run $i failed (exit $ec); stopping."; exit $ec; }
            done
            exit 0
          fi
          SHELL_TESTS=sources/editor/Stride.GameStudio.Avalonia.Tests/Stride.GameStudio.Avalonia.Tests.csproj
          SHELL_NS=Stride.GameStudio.Avalonia.Tests
          SHELL_LETTERS=(S P U B)
          shell_filter=; editor_filter=
          for l in "${SHELL_LETTERS[@]}"; do
            shell_filter+="${shell_filter:+|}FullyQualifiedName~$SHELL_NS.$l"
            editor_filter+="${editor_filter:+&}FullyQualifiedName!~$SHELL_NS.$l"
          done
          log=TestResults/console; mkdir -p $log
          run_tests editor "$EDITOR_SOLUTION" --filter "$editor_filter" > $log/editor.log 2>&1 & editor_pid=$!
          run_tests shell "$SHELL_TESTS" --filter "$shell_filter" > $log/shell.log 2>&1 & shell_pid=$!
          status=0
          wait $editor_pid || { echo "::error::The tests of the editor solution failed"; status=1; }
          wait $shell_pid || { echo "::error::The shell tests of ${SHELL_LETTERS[*]} failed"; status=1; }
          for part in editor shell; do echo "::group::Tests: $part"; cat $log/$part.log; echo "::endgroup::"; done
          if grep -q 'No test matches the given testcase filter' $log/shell.log; then
            echo "::warning::No shell test starts with ${SHELL_LETTERS[*]}: the solution ran them all. Check SHELL_NS and SHELL_LETTERS."
          fi
          exit $status
      - name: Publish Test Report
        if: always()
        uses: phoenix-actions/test-reporting@v16
        with:
          name: 'Test Report: ${{ matrix.name }} Editor Avalonia'
          path: TestResults/*.trx
          reporter: dotnet-trx
          output-to: step-summary
          list-tests: 'failed'
      - name: Failed tests
        if: failure() && steps.test.outcome == 'failure'
        shell: pwsh
        run: ./.github/scripts/show-failed-tests.ps1
      - name: Coverage
        if: ${{ !cancelled() && env.COVERAGE_SETTINGS != '' }}
        uses: ./.github/actions/coverage-lane
        with:
          lane: editor-avalonia
          title: Windows Editor Avalonia
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-editor-avalonia-${{ matrix.platform }}
          # The coverage files are in the coverage artifact
          path: |
            TestResults/
            !TestResults/**/*.cobertura.xml
          if-no-files-found: ignore
