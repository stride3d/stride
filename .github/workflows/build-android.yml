name: Build Android Runtime

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Build Configuration
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      runs-on:
        description: Runner
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - windows-2025-vs2026
  workflow_call:
    inputs:
      build-type:
        default: Debug
        type: string
      # Linux by default: the Android workload installs there in about 16 s, against about 105 s on Windows. The
      # Windows-hosted Android build is covered by the nightly's package build.
      runs-on:
        default: ubuntu-24.04
        type: string

concurrency:
  group: build-android-${{ github.event.pull_request.number || github.sha }}-${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }}-${{ github.event.inputs.runs-on || inputs.runs-on || 'ubuntu-24.04' }}
  cancel-in-progress: true

jobs:
  #
  # Build Stride Runtime for Android
  #
  Android-Runtime:
    name: Android Runtime (${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }})
    runs-on: ${{ github.event.inputs.runs-on || inputs.runs-on || 'ubuntu-24.04' }}
    steps:
      # Bootstrap .github so the local composite action below is resolvable pre-checkout.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/stride-checkout
        with:
          ref: ${{ github.ref }}
          exclude: samples
      - name: Install Android Workload
        uses: ./.github/actions/stride-workload
        with:
          workloads: android
      - name: Setup Android
        # NDK: not installed/pinned — the runner image preinstalls NDKs and each project's
        # Android workload targets resolve _AndroidNdkDirectory locally (Stride.Build.Sdk
        # strips it from ProjectReference dispatches so the value never fragments build
        # cache keys; Stride.Native.targets enforces a minimum version at compile time).
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools
      # Off Windows, the desktop TFM of the runtime projects links its native libraries with the system lld
      # (Stride.Native.targets), which the Ubuntu image lacks.
      - name: Install lld
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build
        shell: pwsh
        run: |
          dotnet build sources/Stride.Android.slnf `
            -nr:false `
            -p:Configuration=${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }} `
            -p:StridePlatforms=Android `
            -p:StrideSkipUnitTests=true `
            -p:StrideSkipAutoPack=true
